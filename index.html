<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topicus AI Tooling Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<style>
/* FIRM shared design tokens and components (both apps) */
:root {
  --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;

  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;

  --accent: #1f4e79;          /* overridden per app */
  --accent-strong: #163a5c;
  --accent-soft: #e6eef6;
  --accent-text: #ffffff;

  --green: #15803d; --green-soft: #dcfce7; --green-text: #14532d;
  --amber: #b45309; --amber-soft: #fef3c7; --amber-text: #78350f;
  --red: #b91c1c;   --red-soft: #fee2e2;   --red-text: #7f1d1d;
  --blue: #1d4ed8;  --blue-soft: #dbeafe;  --blue-text: #1e3a8a;
  --purple: #6d28d9; --purple-soft: #ede9fe; --purple-text: #4c1d95;
  --grey-soft: #e2e8f0; --grey-text: #334155;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.14);
  --maxw: 1180px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.25; font-weight: 600; }
h1 { font-size: 24px; letter-spacing: -0.01em; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0 0 10px; }
small, .muted { color: var(--text-3); }
.muted { font-size: 13px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

/* ---- Layout ---- */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 20px; height: 58px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--text); white-space: nowrap; }
.brand .mark {
  width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
  display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; letter-spacing: 0.02em;
}
.brand .sub { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); line-height: 1.1; }
.nav { display: flex; gap: 4px; margin-left: 12px; flex: 1; }
.nav button {
  background: none; border: 0; padding: 8px 12px; border-radius: 8px; font: inherit; font-weight: 500; color: var(--text-2); cursor: pointer; white-space: nowrap;
}
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.user-chip { display: flex; align-items: center; gap: 10px; }
.user-chip .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.user-chip .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.user-chip .role { font-size: 11.5px; color: var(--text-3); line-height: 1.2; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.user-chip .name { white-space: nowrap; }
.user-chip .signout { margin-left: 6px; }

.page { max-width: var(--maxw); margin: 0 auto; padding: 24px; }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.page-header p { color: var(--text-2); max-width: 720px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.split-wide { grid-template-columns: minmax(0, 1fr) 340px; }
@media (max-width: 900px) { .grid-2, .grid-3, .grid-4, .split, .split-wide { grid-template-columns: 1fr; } }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.right { margin-left: auto; }

/* ---- Cards ---- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-body { padding: 18px 20px; }
.card-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.card-head h2, .card-head h3 { margin: 0; }
.card.clickable { cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s; }
.card.clickable:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--accent-strong); }
.callout.warn { border-color: var(--amber); background: var(--amber-soft); color: var(--amber-text); }
.callout.danger { border-color: var(--red); background: var(--red-soft); color: var(--red-text); }
.callout.ok { border-color: var(--green); background: var(--green-soft); color: var(--green-text); }
.callout.info { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-text); }
.callout.neutral { border-color: var(--border-strong); background: var(--surface-2); color: var(--text-2); }

/* ---- Badges ---- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; background: var(--grey-soft); color: var(--grey-text); }
.badge.green { background: var(--green-soft); color: var(--green-text); }
.badge.amber { background: var(--amber-soft); color: var(--amber-text); }
.badge.red { background: var(--red-soft); color: var(--red-text); }
.badge.blue { background: var(--blue-soft); color: var(--blue-text); }
.badge.purple { background: var(--purple-soft); color: var(--purple-text); }
.badge.accent { background: var(--accent-soft); color: var(--accent-strong); }
.badge.outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); font-weight: 500; }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }

/* ---- Buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--red); border-color: #fca5a5; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.lg { padding: 11px 20px; font-size: 15px; }
.btn.block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }

/* ---- Forms ---- */
label.field { display: block; margin-bottom: 14px; }
label.field > span.lbl, .field > .lbl { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13.5px; }
.lbl .req { color: var(--red); margin-left: 3px; }
.lbl .opt { color: var(--text-3); font-weight: 400; margin-left: 6px; font-size: 12px; }
input[type=text], input[type=search], input[type=url], input[type=email], input[type=number], textarea, select {
  width: 100%; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font: inherit; font-size: 14px; color: var(--text);
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { min-height: 84px; resize: vertical; }
input[type=checkbox], input[type=radio] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.help { color: var(--text-3); font-size: 12.5px; margin-top: 4px; }
.field.invalid input, .field.invalid textarea, .field.invalid select { border-color: var(--red); }
.field .err { color: var(--red); font-size: 12.5px; margin-top: 4px; }
.choice-list { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--border-strong); background: var(--surface-2); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 3px; }
.choice .t { font-weight: 600; }
.choice .h { color: var(--text-3); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font: inherit; font-size: 13px; color: var(--text-2); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* "Why we ask" explanation */
details.why { margin-top: 6px; }
details.why summary { cursor: pointer; color: var(--accent); font-size: 12.5px; font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 5px; }
details.why summary::-webkit-details-marker { display: none; }
details.why summary::before { content: "i"; display: inline-flex; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid currentColor; align-items: center; justify-content: center; font-size: 10px; font-style: italic; font-family: Georgia, serif; }
details.why .why-body { margin-top: 6px; padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--text-2); }
details.why .why-body b { color: var(--text); }

/* ---- Tables ---- */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-3); font-weight: 600; background: var(--surface-2); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }

/* ---- Steps ---- */
.steps { display: flex; gap: 6px; margin-bottom: 20px; }
.step { flex: 1; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
.step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--grey-soft); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.step.active { border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
.step.active .n { background: var(--accent); color: #fff; }
.step.done { color: var(--text-2); }
.step.done .n { background: var(--green-soft); color: var(--green-text); }

/* ---- Modal ---- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; }
.modal.wide { max-width: 900px; }
.modal-head { padding: 18px 22px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 16px 22px; }
.modal-foot { padding: 14px 22px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
.x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--text-3); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.x:hover { background: var(--surface-2); color: var(--text); }

/* ---- Toast ---- */
.toast-host { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; box-shadow: var(--shadow-lg); max-width: 380px; animation: toastin 0.18s ease-out; }
.toast.err { background: var(--red); }
.toast.ok { background: var(--green); }
@keyframes toastin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---- Timeline (change history) ---- */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 18px; }
.tl-item::before { content: ""; position: absolute; left: -22px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.tl-item .tl-meta { font-size: 12.5px; color: var(--text-3); }
.tl-item .tl-rationale { margin: 6px 0; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; border-left: 3px solid var(--border-strong); }
.tl-item ul { margin: 6px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }

/* ---- Misc ---- */
.empty { text-align: center; padding: 40px 20px; color: var(--text-3); }
.empty h3 { color: var(--text-2); }
.kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
.stat { padding: 14px 16px; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.stat .l { color: var(--text-3); font-size: 12.5px; }
.lock { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-3); }
.proto-note { font-size: 12px; color: var(--text-3); border: 1px dashed var(--border-strong); padding: 6px 10px; border-radius: 6px; background: var(--surface); }
.footer { max-width: var(--maxw); margin: 30px auto 24px; padding: 0 24px; font-size: 12px; color: var(--text-3); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.search-big { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px 8px 6px 16px; box-shadow: var(--shadow); }
.search-big input { border: 0; padding: 10px 4px; font-size: 17px; background: transparent; }
.search-big input:focus { outline: none; }
.search-big .btn { border-radius: 10px; }
mark { background: #fde68a; padding: 0 1px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- Mock Entra ID sign-in ---- */
.signin-bg { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #eef2f7 0%, #dfe7f1 100%); padding: 20px; }
.signin { width: 100%; max-width: 440px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); padding: 40px 44px 28px; }
.signin .idp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #605e5c; margin-bottom: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.signin h1 { font-size: 24px; font-weight: 600; margin: 0 0 2px; color: #1b1b1b; }
.signin .to { font-size: 15px; color: #1b1b1b; margin-bottom: 22px; }
.signin .pick { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.acct { display: flex; gap: 12px; align-items: center; padding: 12px 8px; border: 0; background: none; width: 100%; text-align: left; font: inherit; cursor: pointer; border-top: 1px solid #e5e5e5; }
.acct:last-of-type { border-bottom: 1px solid #e5e5e5; }
.acct:hover { background: #f3f3f3; }
.acct .avatar { width: 36px; height: 36px; border-radius: 50%; background: #5c6bc0; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
.acct .n { font-size: 15px; color: #1b1b1b; }
.acct .u { font-size: 13px; color: #605e5c; }
.acct .s { font-size: 12px; color: #605e5c; margin-left: auto; text-align: right; white-space: nowrap; }
.signin .other { display: flex; gap: 12px; align-items: center; padding: 12px 8px; color: #1b1b1b; font-size: 15px; opacity: 0.55; cursor: not-allowed; }
.signin .other .plus { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; color: #605e5c; }
.signin .fine { margin-top: 22px; font-size: 12px; color: #605e5c; line-height: 1.5; }
.signin .fine b { color: #1b1b1b; }


/* Portal accent: teal */
:root {
  --accent: #0f766e;
  --accent-strong: #115e59;
  --accent-soft: #d9f2ef;
}

.hero { padding: 28px 0 8px; text-align: center; }
.hero h1 { font-size: 30px; margin-bottom: 6px; }
.hero p { color: var(--text-2); font-size: 15px; max-width: 640px; margin: 0 auto 18px; }
.hero .search-big { max-width: 720px; margin: 0 auto 14px; }
.hero .chips { justify-content: center; }

.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 26px 0; }
.how .card-body { display: flex; gap: 12px; align-items: flex-start; }
.how .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
@media (max-width: 800px) { .how { grid-template-columns: 1fr; } }

.uc-card .card-body { display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
.uc-card h3 { font-size: 15px; margin: 0; }
.uc-card .desc { color: var(--text-2); font-size: 13px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.uc-card .tools { display: flex; flex-wrap: wrap; gap: 6px; }
.uc-card .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); margin-top: 4px; }
.uc-card .foot span:first-child { white-space: nowrap; }
.uc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .uc-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 680px) { .uc-grid { grid-template-columns: 1fr; } }

.status-strip { height: 4px; border-radius: 10px 10px 0 0; }
.status-strip.permitted { background: var(--green); }
.status-strip.conditional { background: var(--amber); }
.status-strip.pilot { background: var(--blue); }
.status-strip.under-review { background: var(--purple); }
.status-strip.not-permitted { background: var(--red); }

.match { font-size: 12px; color: var(--text-3); }
.match mark { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-2); align-items: center; }

/* Tool cards in intake */
.tool-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 800px) { .tool-pick { grid-template-columns: 1fr; } }
.tool-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; background: var(--surface); display: flex; gap: 10px; align-items: flex-start; }
.tool-card:hover { border-color: var(--border-strong); }
.tool-card.on { border-color: var(--accent); background: var(--accent-soft); }
.tool-card input { margin-top: 3px; }
.tool-card .t { font-weight: 600; }
.tool-card .m { font-size: 12.5px; color: var(--text-3); }
.tool-card.new { border-style: dashed; }

/* Intake layout */

</style>
</head>
<body>
<div id="app"></div>
<script>
/*
 * FIRM policy & guidelines engine (shared between browser and Node).
 *
 * Given a use-case "profile" (classification, data types, affected persons, ...)
 * it works out which policies/guidelines apply, which requirements fire, which
 * intake questions must therefore be asked, and which high-risk rules trigger.
 *
 * The same code runs in the portal (live form adaptation), in the registry
 * (simulator) and on the server (stamping governing versions on submission),
 * so the three can never disagree.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.FirmEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---- Profile fields the engine understands -------------------------------
  // `kind` is "one" (single value) or "many" (array of values).
  const FIELDS = {
    division: {
      label: 'Division',
      kind: 'one',
      options: [
        { value: 'Healthcare', label: 'Topicus Healthcare', short: 'Healthcare' },
        { value: 'Finance', label: 'Topicus Finance', short: 'Finance' },
        { value: 'Education', label: 'Topicus Education', short: 'Education' },
        { value: 'Government', label: 'Topicus Government', short: 'Government' },
        { value: 'Corporate', label: 'Corporate / shared services', short: 'Corporate' }
      ]
    },
    category: {
      label: 'Type of use',
      kind: 'one',
      options: [
        { value: 'content', label: 'Writing, summarising, drafting', short: 'Writing' },
        { value: 'code', label: 'Software development', short: 'Code' },
        { value: 'meetings', label: 'Meeting transcription and notes', short: 'Meetings' },
        { value: 'translation', label: 'Translation', short: 'Translation' },
        { value: 'analysis', label: 'Analysis, search and Q&A', short: 'Analysis' },
        { value: 'images', label: 'Image or media generation', short: 'Images' },
        { value: 'automation', label: 'Process automation (classification, extraction)', short: 'Automation' },
        { value: 'decision-support', label: 'Decision support about people', short: 'Decision support' },
        { value: 'customer-facing', label: 'Customer-facing assistant or content', short: 'Customer-facing' },
        { value: 'other', label: 'Other', short: 'Other' }
      ]
    },
    classification: {
      label: 'Information classification',
      kind: 'one',
      options: [
        { value: 'Public', label: 'Public', hint: 'May be shared with anyone.' },
        { value: 'Internal', label: 'Internal', hint: 'For Topicus employees; limited harm if leaked.' },
        { value: 'Confidential', label: 'Confidential', hint: 'Personal data, customer data, source code, contracts.' },
        { value: 'Secret', label: 'Secret', hint: 'Severe damage if disclosed: patient records, security keys, M&A.' }
      ]
    },
    dataTypes: {
      label: 'Data involved',
      kind: 'many',
      options: [
        { value: 'none', label: 'No real data (synthetic or public only)', short: 'No real data' },
        { value: 'business', label: 'Business information (documents, code, plans)', short: 'Business information' },
        { value: 'personal', label: 'Personal data (names, contact details, IDs)', short: 'Personal data' },
        { value: 'financial', label: 'Financial data of customers', short: 'Financial data' },
        { value: 'special', label: 'Special-category data (health, biometrics, religion, etc.)', short: 'Special-category data' },
        { value: 'minors', label: 'Data about children or students', short: 'Data about minors' }
      ]
    },
    affected: {
      label: 'Who is affected by the output',
      kind: 'many',
      options: [
        { value: 'none', label: 'Nobody in particular (internal productivity)', short: 'Nobody in particular' },
        { value: 'employees', label: 'Topicus employees or applicants', short: 'Employees' },
        { value: 'customers', label: 'Customers or their end users', short: 'Customers' },
        { value: 'patients', label: 'Patients or clients in care', short: 'Patients' },
        { value: 'citizens', label: 'Citizens', short: 'Citizens' },
        { value: 'students', label: 'Pupils or students', short: 'Students' }
      ]
    },
    decisionImpact: {
      label: 'Role in decisions about people',
      kind: 'one',
      options: [
        { value: 'none', label: 'None: output does not influence decisions about people', short: 'None' },
        { value: 'informs', label: 'Informs a decision that a person makes', short: 'Informs a decision' },
        { value: 'automated', label: 'Makes or triggers the decision automatically', short: 'Automated decision' }
      ]
    },
    externalOutput: {
      label: 'Output shared outside Topicus',
      kind: 'one',
      options: [
        { value: 'no', label: 'No, internal use only', short: 'No' },
        { value: 'yes', label: 'Yes, customers, patients, citizens or the public receive it', short: 'Yes' }
      ]
    },
    toolStatus: {
      label: 'Tool',
      kind: 'one',
      options: [
        { value: 'approved', label: 'An already approved tool', short: 'Approved tool' },
        { value: 'new', label: 'A new tool that is not yet approved', short: 'New tool' }
      ]
    },
    hosting: {
      label: 'Tool hosting location',
      kind: 'one',
      options: [
        { value: 'eu', label: 'EU / EEA' },
        { value: 'non-eu', label: 'Outside the EU' },
        { value: 'unknown', label: 'Unknown' }
      ]
    },
    trainsOnData: {
      label: 'Vendor trains on customer data',
      kind: 'one',
      options: [
        { value: 'no', label: 'No' },
        { value: 'yes', label: 'Yes' },
        { value: 'unknown', label: 'Unknown' }
      ]
    }
  };

  const CLASSIFICATION_ORDER = ['Public', 'Internal', 'Confidential', 'Secret'];

  function optionLabel(field, value, short) {
    const f = FIELDS[field];
    if (!f) return String(value);
    const o = f.options.find((x) => x.value === value);
    if (!o) return String(value);
    return short && o.short ? o.short : o.label;
  }

  // ---- Condition evaluation --------------------------------------------------
  // Condition grammar:
  //   { always: true }
  //   { all: [cond, ...] }   every child must hold
  //   { any: [cond, ...] }   at least one child must hold
  //   { field, in: [...] }         scalar field value is one of
  //   { field, includesAny: [...] } array field shares a value with
  //   { field, eq: value }
  function evaluateCondition(cond, profile) {
    if (!cond) return true; // null/undefined = inherits from parent
    if (cond.always) return true;
    if (Array.isArray(cond.all)) return cond.all.every((c) => evaluateCondition(c, profile));
    if (Array.isArray(cond.any)) return cond.any.some((c) => evaluateCondition(c, profile));
    if (cond.field) {
      const v = profile ? profile[cond.field] : undefined;
      if (cond.in) return v !== undefined && v !== null && cond.in.indexOf(v) !== -1;
      if (cond.includesAny) {
        const arr = Array.isArray(v) ? v : v ? [v] : [];
        return cond.includesAny.some((x) => arr.indexOf(x) !== -1);
      }
      if (Object.prototype.hasOwnProperty.call(cond, 'eq')) return v === cond.eq;
    }
    return false;
  }

  function describeLeaf(cond) {
    const f = FIELDS[cond.field];
    const name = f ? f.label : cond.field;
    const vals = (cond.in || cond.includesAny || [cond.eq]).map((v) => optionLabel(cond.field, v, true));
    const joined = vals.length > 1 ? vals.slice(0, -1).join(', ') + ' or ' + vals[vals.length - 1] : vals[0];
    if (cond.includesAny) return name + ' includes ' + joined;
    return name + ' is ' + joined;
  }

  function describeCondition(cond) {
    if (!cond || cond.always) return 'Always applies';
    if (Array.isArray(cond.all)) return cond.all.map((c) => wrap(c)).join(' AND ');
    if (Array.isArray(cond.any)) return cond.any.map((c) => wrap(c)).join(' OR ');
    if (cond.field) return describeLeaf(cond);
    return 'Never';
    function wrap(c) {
      const s = describeCondition(c);
      return c.all || c.any ? '(' + s + ')' : s;
    }
  }

  // ---- Base fields (registry minimum, always collected) -----------------------
  const BASE_FIELDS = {
    'base:owner': { label: 'Accountable owner', step: 'Use case details' },
    'base:purpose': { label: 'Purpose and scope', step: 'Use case details' },
    'base:classification': { label: 'Information classification', step: 'Data and classification' },
    'base:tool': { label: 'Tool details (vendor, hosting, training)', step: 'Tool' },
    'base:justification': { label: 'Why existing approved tools are insufficient', step: 'Tool' }
  };

  // ---- Main evaluation ---------------------------------------------------------
  // profile: { division, category, classification, dataTypes[], affected[], decisionImpact, externalOutput, toolStatus, hosting, trainsOnData }
  // policiesDoc: { policies: [...], riskRules: { version, rules: [...] } }
  function evaluate(profile, policiesDoc) {
    const applicable = [];
    const intakeFields = [];
    const governedBy = [];
    const seenKeys = new Set();

    (policiesDoc.policies || []).forEach((p) => {
      if (p.status && p.status !== 'active') return;
      if (!evaluateCondition(p.appliesWhen, profile)) return;
      const fired = [];
      (p.requirements || []).forEach((r) => {
        if (!evaluateCondition(r.when, profile)) return;
        fired.push(r);
        if (r.intake && !seenKeys.has(r.intake.key)) {
          seenKeys.add(r.intake.key);
          intakeFields.push({
            key: r.intake.key,
            label: r.intake.label,
            type: r.intake.type,
            required: !!r.intake.required,
            options: r.intake.options || null,
            placeholder: r.intake.placeholder || '',
            why: r.why,
            requirementId: r.id,
            requirementText: r.text,
            policyId: p.id,
            policyTitle: p.shortTitle || p.title,
            policyType: p.type
          });
        }
      });
      applicable.push({
        id: p.id,
        title: p.title,
        shortTitle: p.shortTitle || p.title,
        type: p.type,
        source: p.source,
        version: p.version,
        reason: describeCondition(p.appliesWhen),
        requirements: fired.map((r) => ({
          id: r.id,
          text: r.text,
          why: r.why,
          coveredBy: r.coveredBy || null,
          coveredLabel: r.coveredBy ? (BASE_FIELDS[r.coveredBy] || { label: r.coveredBy }).label : null,
          intakeKey: r.intake ? r.intake.key : null,
          reason: r.when ? describeCondition(r.when) : null
        }))
      });
      governedBy.push({ policyId: p.id, version: p.version });
    });

    const riskRules = policiesDoc.riskRules || { rules: [], version: 0 };
    const flags = (riskRules.rules || []).filter((r) => evaluateCondition(r.when, profile));
    let riskLevel = 'standard';
    if (flags.some((f) => f.severity === 'high')) riskLevel = 'high';
    else if (flags.some((f) => f.severity === 'elevated')) riskLevel = 'elevated';
    governedBy.push({ riskRulesVersion: riskRules.version });

    return {
      applicable,
      intakeFields,
      risk: {
        level: riskLevel,
        flags: flags.map((f) => ({ id: f.id, label: f.label, severity: f.severity, reference: f.reference, guidance: f.guidance }))
      },
      governedBy
    };
  }

  // ---- Routing (mock of the existing Power Automate flow) -----------------------
  function route(profile, riskLevel, routingDoc) {
    const primary = (routingDoc.divisionCoordinators || {})[profile.division] || routingDoc.divisionCoordinators.Corporate;
    const escalations = (routingDoc.escalations || []).filter((e) => {
      if (e.when && e.when.riskLevel) return e.when.riskLevel.indexOf(riskLevel) !== -1;
      return evaluateCondition(e.when, profile);
    });
    return {
      primary,
      escalations: escalations.map((e) => ({ id: e.id, label: e.label, to: e.to, reason: e.reason }))
    };
  }

  // ---- Small helpers used by both UIs -------------------------------------------
  function classificationAtLeast(a, b) {
    return CLASSIFICATION_ORDER.indexOf(a) >= CLASSIFICATION_ORDER.indexOf(b);
  }

  // Suggest a classification from the declared data types (the requester confirms it).
  function suggestClassification(dataTypes) {
    const d = dataTypes || [];
    if (d.indexOf('special') !== -1) return 'Secret';
    if (d.indexOf('minors') !== -1 || d.indexOf('financial') !== -1 || d.indexOf('personal') !== -1) return 'Confidential';
    if (d.indexOf('business') !== -1) return 'Internal';
    return 'Public';
  }

  const RISK_LABELS = {
    high: { title: 'Potentially high-risk', text: 'Full assessment by AI Governance is required before a decision. This flag is rule-based; the final decision stays with the decision maker.' },
    elevated: { title: 'Elevated attention', text: 'Additional checks apply. The decision maker may ask for extra information.' },
    standard: { title: 'Standard review', text: 'No high-risk rules triggered. Standard review by the division AI coordinator.' }
  };

  return {
    FIELDS,
    BASE_FIELDS,
    CLASSIFICATION_ORDER,
    RISK_LABELS,
    optionLabel,
    evaluateCondition,
    describeCondition,
    evaluate,
    route,
    classificationAtLeast,
    suggestClassification
  };
});


/*
 * FIRM domain service (shared between the Node server and the hosted, browser-only build).
 *
 * All business rules live here: policy versioning with mandatory rationale, request
 * intake with data minimisation and governing-version stamping, exports, tool lookup.
 * Storage is injected as an adapter: { read(name), write(name, obj), reset() }.
 *   - server.js uses a JSON-file adapter
 *   - shared/localapi.js (hosted build) uses a localStorage adapter seeded from FIRM_SEED
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'));
  else root.FirmService = factory(root.FirmEngine);
})(typeof self !== 'undefined' ? self : this, function (engine) {
  'use strict';

  function ServiceError(status, message) { this.status = status; this.message = message; }
  ServiceError.prototype = Object.create(Error.prototype);

  const EDITABLE = ['title', 'shortTitle', 'type', 'source', 'issuer', 'reference', 'status', 'owner', 'summary', 'appliesWhen', 'requirements'];

  function clone(o) { return JSON.parse(JSON.stringify(o === undefined ? null : o)); }
  function snapshotOf(p) { const s = {}; EDITABLE.forEach((k) => { s[k] = clone(p[k]); }); return s; }
  function hasRole(user, role) { return !!(user && user.roles && user.roles.indexOf(role) !== -1); }

  function diffPolicy(oldP, newP) {
    const changes = [];
    ['title', 'shortTitle', 'type', 'source', 'issuer', 'reference', 'status', 'owner', 'summary'].forEach((k) => {
      if ((oldP[k] || '') !== (newP[k] || '')) changes.push('Changed ' + k + (k === 'status' ? ' to "' + newP[k] + '"' : ''));
    });
    if (JSON.stringify(oldP.appliesWhen || null) !== JSON.stringify(newP.appliesWhen || null)) changes.push('Changed applicability to: ' + engine.describeCondition(newP.appliesWhen));
    const oldReq = new Map((oldP.requirements || []).map((r) => [r.id, r]));
    const newReq = new Map((newP.requirements || []).map((r) => [r.id, r]));
    newReq.forEach((r, id) => {
      if (!oldReq.has(id)) changes.push('Added ' + id + ': ' + r.text);
      else if (JSON.stringify(oldReq.get(id)) !== JSON.stringify(r)) changes.push('Modified ' + id);
    });
    oldReq.forEach((r, id) => { if (!newReq.has(id)) changes.push('Removed ' + id + ': ' + r.text); });
    return changes;
  }

  function validatePolicyInput(p) {
    if (!p || typeof p !== 'object') return 'Missing policy';
    if (!p.title || !String(p.title).trim()) return 'Title is required';
    if (['policy', 'guideline', 'regulation', 'standard'].indexOf(p.type) === -1) return 'Type must be policy, guideline, regulation or standard';
    if (['active', 'draft', 'retired'].indexOf(p.status) === -1) return 'Status must be active, draft or retired';
    if (!Array.isArray(p.requirements)) return 'Requirements must be a list';
    const ids = new Set();
    for (const r of p.requirements) {
      if (!r.id || !r.text) return 'Every requirement needs an id and text';
      if (ids.has(r.id)) return 'Duplicate requirement id ' + r.id;
      ids.add(r.id);
      if (r.intake && (!r.intake.key || !r.intake.label || !r.intake.type)) return 'Requirement ' + r.id + ': intake needs key, label and type';
    }
    return null;
  }

  function csvEscape(v) {
    if (v === null || v === undefined) return '';
    const s = Array.isArray(v) ? v.join('; ') : String(v);
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCsv(rows, columns) {
    return [columns.join(',')].concat(rows.map((r) => columns.map((c) => csvEscape(r[c])).join(','))).join('\n');
  }
  function requireRationale(rationale, what) {
    if (!rationale || String(rationale).trim().length < 10) throw new ServiceError(400, 'A rationale of at least 10 characters is required ' + what);
  }

  function create(store) {
    const S = {};

    // ---- read models -------------------------------------------------------
    S.accounts = function () {
      const users = store.read('users');
      return { tenant: users.tenant, accounts: users.accounts.map((a) => ({ oid: a.oid, name: a.name, upn: a.upn, jobTitle: a.jobTitle, department: a.department, division: a.division, roles: a.roles, lastSignIn: a.lastSignIn })) };
    };
    S.userByOid = function (oid) { return store.read('users').accounts.find((a) => a.oid === oid) || null; };
    S.policies = function () { return store.read('policies'); };
    S.catalog = function () { return store.read('catalog'); };
    S.routing = function () { return store.read('routing'); };

    S.evaluate = function (profile) {
      const result = engine.evaluate(profile || {}, store.read('policies'));
      result.routing = engine.route(profile || {}, result.risk.level, store.read('routing'));
      return result;
    };

    S.toolLookup = function (name) {
      const q = (name || '').trim().toLowerCase();
      if (!q) return { found: false };
      const kb = store.read('tool-knowledge');
      const hit = kb.tools.find((t) => t.name.toLowerCase() === q || (t.aliases || []).some((a) => a.toLowerCase() === q))
        || kb.tools.find((t) => t.name.toLowerCase().indexOf(q) !== -1 || q.indexOf(t.name.toLowerCase()) !== -1);
      if (!hit) return { found: false, suggestions: kb.tools.slice(0, 6).map((t) => t.name) };
      return { found: true, tool: hit, disclaimer: kb.disclaimer };
    };

    // ---- policies: append-only versioning ----------------------------------
    S.createPolicy = function (user, input, rationale) {
      if (!hasRole(user, 'Policy.Owner')) throw new ServiceError(403, 'Only policy owners can create policies');
      const err = validatePolicyInput(input); if (err) throw new ServiceError(400, err);
      requireRationale(rationale, 'when creating a policy');
      const doc = store.read('policies');
      let id = (input.id || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
      if (!id) id = (input.type === 'guideline' ? 'GL-' : input.type === 'regulation' ? 'REG-' : input.type === 'standard' ? 'STD-' : 'POL-') + input.title.toUpperCase().replace(/[^A-Z0-9]+/g, '').slice(0, 8);
      if (doc.policies.some((x) => x.id === id)) throw new ServiceError(409, 'A policy with id ' + id + ' already exists');
      const now = new Date().toISOString();
      const policy = Object.assign({ id: id }, snapshotOf(input), {
        version: 1,
        history: [{ version: 1, at: now, by: user.name, rationale: rationale.trim(), changes: ['Created'], snapshot: snapshotOf(input) }]
      });
      doc.policies.push(policy);
      store.write('policies', doc);
      return policy;
    };

    S.updatePolicy = function (user, id, input, rationale) {
      if (!hasRole(user, 'Policy.Owner')) throw new ServiceError(403, 'Only policy owners can change policies');
      const doc = store.read('policies');
      const idx = doc.policies.findIndex((x) => x.id === id);
      if (idx === -1) throw new ServiceError(404, 'Unknown policy');
      const old = doc.policies[idx];
      const merged = Object.assign({}, old, input || {});
      const err = validatePolicyInput(merged); if (err) throw new ServiceError(400, err);
      requireRationale(rationale, 'for every change');
      const changes = diffPolicy(old, merged);
      if (!changes.length) throw new ServiceError(400, 'No changes detected');
      // Backfill the snapshot of the version being superseded so the state that governed earlier intakes stays reconstructible.
      const cur = old.history.find((h) => h.version === old.version);
      if (cur && !cur.snapshot) cur.snapshot = snapshotOf(old);
      const updated = Object.assign({}, old, snapshotOf(merged), {
        id: old.id,
        version: old.version + 1,
        history: old.history.concat([{ version: old.version + 1, at: new Date().toISOString(), by: user.name, rationale: rationale.trim(), changes: changes, snapshot: snapshotOf(merged) }])
      });
      doc.policies[idx] = updated;
      store.write('policies', doc);
      return updated;
    };

    S.updateRiskRules = function (user, rules, rationale) {
      if (!hasRole(user, 'Policy.Owner')) throw new ServiceError(403, 'Only policy owners can change risk rules');
      if (!Array.isArray(rules)) throw new ServiceError(400, 'rules must be a list');
      requireRationale(rationale, 'for every change');
      const doc = store.read('policies');
      const rr = doc.riskRules;
      const oldMap = new Map(rr.rules.map((r) => [r.id, r]));
      const newMap = new Map(rules.map((r) => [r.id, r]));
      const changes = [];
      newMap.forEach((r, id) => {
        if (!oldMap.has(id)) changes.push('Added ' + id + ': ' + r.label);
        else if (JSON.stringify(oldMap.get(id)) !== JSON.stringify(r)) changes.push('Modified ' + id);
      });
      oldMap.forEach((r, id) => { if (!newMap.has(id)) changes.push('Removed ' + id + ': ' + r.label); });
      if (!changes.length) throw new ServiceError(400, 'No changes detected');
      const cur = rr.history.find((h) => h.version === rr.version);
      if (cur && !cur.snapshot) cur.snapshot = { rules: clone(rr.rules) };
      rr.version += 1;
      rr.rules = rules;
      rr.history.push({ version: rr.version, at: new Date().toISOString(), by: user.name, rationale: rationale.trim(), changes: changes, snapshot: { rules: clone(rules) } });
      store.write('policies', doc);
      return rr;
    };

    // ---- requests (intakes) ------------------------------------------------
    S.listRequests = function (user) {
      if (!user) throw new ServiceError(401, 'Not signed in');
      const all = store.read('requests').requests;
      const visible = hasRole(user, 'Policy.Owner') ? all : all.filter((r) => r.requester && r.requester.upn === user.upn);
      return { requests: visible.slice().sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1)) };
    };

    S.submitRequest = function (user, body) {
      if (!user) throw new ServiceError(401, 'Sign in to submit a request');
      body = body || {};
      const doc = store.read('policies');
      const profile = {};
      Object.keys(engine.FIELDS).forEach((k) => { if (body.profile && body.profile[k] !== undefined) profile[k] = body.profile[k]; });
      const result = engine.evaluate(profile, doc);
      // Data minimisation: only store answers to questions the engine actually asked.
      const allowed = new Set(result.intakeFields.map((f) => f.key));
      const answers = {};
      Object.keys(body.answers || {}).forEach((k) => { if (allowed.has(k)) answers[k] = body.answers[k]; });
      const missing = result.intakeFields.filter((f) => f.required && (answers[f.key] === undefined || answers[f.key] === '' || answers[f.key] === false || (Array.isArray(answers[f.key]) && !answers[f.key].length)));
      if (missing.length) throw new ServiceError(400, 'Missing required answers: ' + missing.map((f) => f.key).join(', '));
      if (!body.base || !body.base.owner || !body.base.purpose || !body.base.scope) throw new ServiceError(400, 'Owner, purpose and scope are required');
      if (body.tool && body.tool.mode === 'new' && body.useCaseHasApprovedTools && !(body.justification || '').trim()) throw new ServiceError(400, 'Explain why the existing approved tools are insufficient');
      const routing = engine.route(profile, result.risk.level, store.read('routing'));
      const reqStore = store.read('requests');
      const year = new Date().getFullYear();
      const seq = reqStore.requests.filter((r) => r.id.indexOf('REQ-' + year) === 0).length + 61;
      const record = {
        id: 'REQ-' + year + '-' + String(seq).padStart(4, '0'),
        submittedAt: new Date().toISOString(),
        requester: { name: user.name, upn: user.upn, department: user.department },
        status: 'Submitted',
        decision: null,
        type: body.type || (body.tool && body.tool.mode === 'new' ? 'new-tool' : 'existing-use-case'),
        useCaseId: body.useCaseId || null,
        useCaseTitle: body.useCaseTitle || body.base.title || null,
        tool: body.tool || null,
        justification: (body.justification || '').trim() || null,
        profile: profile,
        base: { owner: body.base.owner, purpose: body.base.purpose, scope: body.base.scope, title: body.base.title || null },
        answers: answers,
        risk: { level: result.risk.level, flags: result.risk.flags.map((f) => f.id) },
        governedBy: result.governedBy,
        routing: { primary: routing.primary, escalations: routing.escalations.map((e) => e.id), listsItemId: 230 + reqStore.requests.length, flowRunId: '0858513' + String(Date.now()).slice(-13) }
      };
      reqStore.requests.push(record);
      store.write('requests', reqStore);
      return { request: record, evaluation: result, routing: routing };
    };

    // ---- exports -----------------------------------------------------------
    S.exportPoliciesJson = function () { return JSON.stringify(store.read('policies'), null, 2); };
    S.exportPoliciesCsv = function () {
      const doc = store.read('policies'); const rows = [];
      doc.policies.forEach((pol) => (pol.requirements || []).forEach((r) => rows.push({
        policyId: pol.id, policyTitle: pol.title, type: pol.type, source: pol.source, status: pol.status, owner: pol.owner, version: pol.version,
        appliesWhen: engine.describeCondition(pol.appliesWhen), requirementId: r.id, requirement: r.text, requirementWhen: r.when ? engine.describeCondition(r.when) : 'Inherits policy applicability',
        intakeKey: r.intake ? r.intake.key : (r.coveredBy || ''), intakeQuestion: r.intake ? r.intake.label : '', why: r.why
      })));
      return toCsv(rows, ['policyId', 'policyTitle', 'type', 'source', 'status', 'owner', 'version', 'appliesWhen', 'requirementId', 'requirement', 'requirementWhen', 'intakeKey', 'intakeQuestion', 'why']);
    };
    S.exportHistoryCsv = function () {
      const doc = store.read('policies'); const rows = [];
      doc.policies.forEach((pol) => (pol.history || []).forEach((h) => rows.push({ entity: pol.id, title: pol.title, version: h.version, changedAt: h.at, changedBy: h.by, rationale: h.rationale, changes: h.changes })));
      (doc.riskRules.history || []).forEach((h) => rows.push({ entity: 'RISK-RULES', title: 'High-risk screening rules', version: h.version, changedAt: h.at, changedBy: h.by, rationale: h.rationale, changes: h.changes }));
      rows.sort((a, b) => (a.changedAt < b.changedAt ? 1 : -1));
      return toCsv(rows, ['entity', 'title', 'version', 'changedAt', 'changedBy', 'rationale', 'changes']);
    };
    S.exportRequestsCsv = function (user) {
      if (!hasRole(user, 'Policy.Owner')) throw new ServiceError(403, 'Only policy owners can export intakes');
      const rows = store.read('requests').requests.map((r) => ({
        id: r.id, submittedAt: r.submittedAt, requester: r.requester.name, department: r.requester.department, status: r.status, type: r.type, useCase: r.useCaseTitle,
        tool: r.tool ? r.tool.name : '', classification: r.profile.classification, riskLevel: r.risk.level, riskFlags: r.risk.flags,
        governedBy: r.governedBy.map((g) => (g.policyId ? g.policyId + '@v' + g.version : 'RISK-RULES@v' + g.riskRulesVersion)), routedTo: r.routing.primary.name
      }));
      return toCsv(rows, ['id', 'submittedAt', 'requester', 'department', 'status', 'type', 'useCase', 'tool', 'classification', 'riskLevel', 'riskFlags', 'governedBy', 'routedTo']);
    };
    S.EXPORTS = {
      'policies.json': { filename: 'firm-policies-export.json', mime: 'application/json', fn: 'exportPoliciesJson' },
      'policies.csv': { filename: 'firm-policies-requirements.csv', mime: 'text/csv; charset=utf-8', fn: 'exportPoliciesCsv' },
      'history.csv': { filename: 'firm-policy-change-history.csv', mime: 'text/csv; charset=utf-8', fn: 'exportHistoryCsv' },
      'requests.csv': { filename: 'firm-intakes.csv', mime: 'text/csv; charset=utf-8', fn: 'exportRequestsCsv' }
    };

    // ---- demo reset --------------------------------------------------------
    S.reset = function (user) {
      if (!hasRole(user, 'Policy.Owner')) throw new ServiceError(403, 'Only policy owners can reset demo data');
      store.reset();
      return { ok: true };
    };

    /**
     * Route an API-shaped call (method + path + body) to the service. Used by the
     * hosted build so the front-end code is identical in both environments.
     * Returns { status, body } or throws ServiceError.
     */
    S.dispatch = function (method, path, body, user) {
      const url = path.split('?'); const p = url[0]; const qs = {};
      (url[1] || '').split('&').forEach((kv) => { if (kv) { const i = kv.indexOf('='); qs[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); } });
      if (p === '/api/accounts' && method === 'GET') return S.accounts();
      if (p === '/api/me' && method === 'GET') { if (!user) throw new ServiceError(401, 'Not signed in'); return user; }
      if (p === '/api/policies' && method === 'GET') return S.policies();
      if (p === '/api/catalog' && method === 'GET') return S.catalog();
      if (p === '/api/routing' && method === 'GET') return S.routing();
      if (p === '/api/evaluate' && method === 'POST') return S.evaluate(body && body.profile);
      if (p === '/api/tool-lookup' && method === 'GET') return S.toolLookup(qs.name);
      if (p === '/api/policies' && method === 'POST') return S.createPolicy(user, body.policy, body.rationale);
      const m = /^\/api\/policies\/([A-Za-z0-9-]+)$/.exec(p);
      if (m && method === 'PUT') return S.updatePolicy(user, m[1], body.policy, body.rationale);
      if (p === '/api/risk-rules' && method === 'PUT') return S.updateRiskRules(user, body.rules, body.rationale);
      if (p === '/api/requests' && method === 'GET') return S.listRequests(user);
      if (p === '/api/requests' && method === 'POST') return S.submitRequest(user, body);
      if (p === '/api/admin/reset' && method === 'POST') return S.reset(user);
      const ex = /^\/api\/export\/([a-z.]+)$/.exec(p);
      if (ex && method === 'GET' && S.EXPORTS[ex[1]]) return S[S.EXPORTS[ex[1]].fn](user);
      throw new ServiceError(404, 'Unknown API route ' + p);
    };

    return S;
  }

  return { create: create, ServiceError: ServiceError, validatePolicyInput: validatePolicyInput, diffPolicy: diffPolicy, toCsv: toCsv };
});

text":"Only personal data that is strictly necessary is processed (Art. 5(1)(c)).","why":"Data minimisation limits harm if something goes wrong and is often the easiest way to lower the risk level of a use case.","when":null,"coveredBy":null,"intake":{"key":"dataMinimisation","label":"Which personal data is strictly necessary, and what is deliberately excluded?","type":"textarea","required":true,"placeholder":"e.g. only the free-text complaint, no name, BSN or account number"}},{"id":"GDPR-03","text":"A data processing agreement is in place with any vendor that processes personal data (Art. 28).","why":"The vendor acts as a processor; without a DPA Topicus cannot lawfully hand over personal data.","when":{"all":[{"field":"toolStatus","in":["new"]}]},"coveredBy":null,"intake":{"key":"dpa","label":"Is a data processing agreement (DPA) in place with the vendor?","type":"select","required":true,"options":["Yes","In negotiation","No","Unknown"]}},{"id":"GDPR-04","text":"A Data Protection Impact Assessment is carried out for likely high-risk processing (Art. 35).","why":"Special-category data, data about children and automated decisions are on the mandatory DPIA list of the Dutch Data Protection Authority.","when":{"any":[{"field":"dataTypes","includesAny":["special","minors"]},{"field":"decisionImpact","in":["automated"]}]},"coveredBy":null,"intake":{"key":"dpiaStatus","label":"Has a DPIA been started with the Privacy Officer?","type":"select","required":true,"options":["Yes, completed","Yes, in progress","Not yet","Unsure whether one is needed"]}},{"id":"GDPR-05","text":"Processing of special-category data relies on an Art. 9 exception.","why":"Health, biometric and similar data is prohibited to process unless a specific exception applies. In healthcare this is usually Art. 9(2)(h).","when":{"all":[{"field":"dataTypes","includesAny":["special"]}]},"coveredBy":null,"intake":{"key":"art9Exception","label":"Which Art. 9 exception applies to the special-category data?","type":"select","required":true,"options":["Explicit consent (9(2)(a))","Provision of healthcare (9(2)(h))","Substantial public interest (9(2)(g))","Not yet determined"]}},{"id":"GDPR-06","text":"Data subjects are informed about the processing (Art. 13/14).","why":"People have a right to know their data is processed by an AI system, and to object or request access.","when":null,"coveredBy":null,"intake":{"key":"dataSubjectInfo","label":"How are the people whose data is used informed about this AI processing?","type":"textarea","required":false,"placeholder":"e.g. privacy statement update, notice in the customer portal"}}],"version":2,"history":[{"version":1,"at":"2025-03-12T09:05:00Z","by":"Privacy Office","rationale":"GDPR requirements mapped to AI intake questions.","changes":["Created with GDPR-01 to GDPR-04"],"snapshot":null},{"version":2,"at":"2026-01-22T15:00:00Z","by":"Privacy Office","rationale":"Healthcare pilots started processing health data; made the Art. 9 exception explicit and added data subject information.","changes":["Added GDPR-05 (Art. 9 exception)","Added GDPR-06 (informing data subjects)"],"snapshot":null}]},{"id":"REG-AIACT","type":"regulation","title":"EU Artificial Intelligence Act","shortTitle":"EU AI Act","source":"External","issuer":"European Union","reference":"Regulation (EU) 2024/1689","status":"active","owner":"Marieke Jansen","summary":"Risk-based regulation of AI systems. Use cases that inform or make decisions about people in Annex III areas (employment, essential services, education, public services) are high-risk and need human oversight, logging and documentation. Transparency obligations apply when people interact with AI or receive AI-generated content.","appliesWhen":{"any":[{"field":"decisionImpact","in":["informs","automated"]},{"field":"externalOutput","in":["yes"]},{"field":"category","in":["customer-facing","decision-support"]}]},"requirements":[{"id":"AIA-01","text":"The intended purpose of the AI system is documented (Art. 3(12)).","why":"The intended purpose determines the risk class. It is the same purpose statement collected for the registry.","when":null,"coveredBy":"base:purpose","intake":null},{"id":"AIA-02","text":"The use case is screened against the Annex III high-risk areas.","why":"Annex III lists the areas where AI that influences decisions about people is classified high-risk. Your answer drives the risk flag on this request.","when":{"all":[{"field":"decisionImpact","in":["informs","automated"]},{"field":"affected","includesAny":["employees","customers","patients","citizens","students"]}]},"coveredBy":null,"intake":{"key":"annexIII","label":"Does the use case fall into one of these Annex III areas?","type":"select","required":true,"options":["Employment, recruitment or worker management","Access to essential private or public services (credit, insurance, healthcare, benefits)","Education and vocational training","Public services, law enforcement or migration","None of these"]}},{"id":"AIA-03","text":"Effective human oversight measures are in place (Art. 14).","why":"For automated decisions the law requires that a competent person can understand, monitor and override the system.","when":{"all":[{"field":"decisionImpact","in":["automated"]}]},"coveredBy":null,"intake":{"key":"oversightMeasures","label":"Which oversight measures let a person monitor and override the system?","type":"textarea","required":true,"placeholder":"e.g. sampled review of 10% of decisions, stop button, appeal route"}},{"id":"AIA-04","text":"People are informed when they interact with an AI system or receive AI-generated content (Art. 50).","why":"Transparency obligations apply from August 2026 to chatbots and to synthetic text, image and audio shared with the public.","when":{"any":[{"field":"externalOutput","in":["yes"]},{"field":"category","in":["customer-facing"]}]},"coveredBy":null,"intake":{"key":"aiInteractionNotice","label":"Are people informed that they are interacting with, or receiving output from, an AI system?","type":"select","required":true,"options":["Yes, before the interaction","Yes, in the output","Not yet","Not applicable"]}},{"id":"AIA-05","text":"Inputs and outputs are logged so decisions can be traced (Art. 12).","why":"Logging is required for high-risk systems and is the only way to investigate a complaint afterwards.","when":{"all":[{"field":"decisionImpact","in":["informs","automated"]}]},"coveredBy":null,"intake":{"key":"logging","label":"Are inputs and outputs logged for traceability?","type":"select","required":true,"options":["Yes, with retention policy","Partially","No","Unknown"]}},{"id":"AIA-06","text":"Staff operating the AI system have a sufficient level of AI literacy (Art. 4).","why":"Since February 2025 organisations must ensure the people using AI systems understand their capabilities and limits.","when":null,"coveredBy":null,"intake":{"key":"aiLiteracyAck","label":"Users of this AI system have completed (or will complete) the Topicus AI literacy module.","type":"checkbox","required":true}}],"version":2,"history":[{"version":1,"at":"2025-08-01T08:00:00Z","by":"Marieke Jansen","rationale":"AI Act entered into force; prohibited practices and AI literacy obligations apply from Feb 2025.","changes":["Created with AIA-01, AIA-02, AIA-06"],"snapshot":null},{"version":2,"at":"2026-07-15T10:00:00Z","by":"Marieke Jansen","rationale":"Prepared for the 2 August 2026 application date of transparency (Art. 50) and high-risk obligations.","changes":["Added AIA-03 (human oversight)","Added AIA-04 (transparency)","Added AIA-05 (logging)"],"snapshot":null}]},{"id":"STD-NEN7510","type":"standard","title":"NEN 7510 Information security in healthcare","shortTitle":"NEN 7510","source":"External","issuer":"NEN (Royal Netherlands Standardization Institute)","reference":"NEN 7510-1/2:2017","status":"active","owner":"Tom Visser","summary":"Dutch healthcare information security standard. Applies to Topicus Healthcare use cases that touch patient data: the healthcare security officer assesses the processing, access to patient data is logged, and a care professional remains responsible for any decision informed by AI output.","appliesWhen":{"all":[{"field":"division","in":["Healthcare"]},{"field":"dataTypes","includesAny":["personal","special"]}]},"requirements":[{"id":"NEN-01","text":"The healthcare information security officer has assessed the processing of patient data.","why":"NEN 7510 requires a risk assessment before patient data is processed in a new way or by a new system.","when":null,"coveredBy":null,"intake":{"key":"nenAssessment","label":"Has the healthcare information security officer assessed this processing?","type":"select","required":true,"options":["Yes","Scheduled","Not yet","Unsure who to ask"]}},{"id":"NEN-02","text":"Access to patient data through the AI system is logged.","why":"Patients have a right to know who accessed their record; AI systems are no exception.","when":null,"coveredBy":null,"intake":{"key":"patientDataLogging","label":"Is access to patient data via this AI system logged per user?","type":"select","required":true,"options":["Yes","No","Unknown"]}},{"id":"NEN-03","text":"A care professional remains responsible for decisions informed by AI output.","why":"Professional responsibility under the Wet BIG cannot be delegated to a system.","when":{"all":[{"field":"decisionImpact","in":["informs","automated"]}]},"coveredBy":null,"intake":{"key":"responsibleProfessional","label":"Which care professional (role) remains responsible for decisions informed by the output?","type":"text","required":true,"placeholder":"e.g. treating physician, district nurse"}},{"id":"NEN-04","text":"Software whose output may influence diagnosis or treatment is checked against the Medical Device Regulation.","why":"If the output steers clinical decisions the software may qualify as a medical device, which changes the approval route entirely.","when":{"all":[{"field":"decisionImpact","in":["informs","automated"]},{"field":"affected","includesAny":["patients"]}]},"coveredBy":null,"intake":{"key":"mdrCheck","label":"Could the output influence a diagnosis or treatment decision?","type":"select","required":true,"options":["No, administrative only","Possibly","Yes","Unsure"]}}],"version":1,"history":[{"version":1,"at":"2026-01-22T15:20:00Z","by":"Tom Visser","rationale":"Healthcare division started its first AI pilots with patient letters.","changes":["Created with NEN-01 to NEN-04"],"snapshot":null}]},{"id":"REG-DORA","type":"regulation","title":"Digital Operational Resilience Act (DORA)","shortTitle":"DORA","source":"External","issuer":"European Union","reference":"Regulation (EU) 2022/2554","status":"active","owner":"Tom Visser","summary":"Applies to financial entities and their ICT service providers. Topicus Finance products fall under customers' DORA obligations, so any new AI vendor must be recorded in the ICT third-party register and assessed for criticality, exit strategy and concentration risk.","appliesWhen":{"all":[{"field":"division","in":["Finance"]},{"field":"toolStatus","in":["new"]}]},"requirements":[{"id":"DORA-01","text":"The vendor is recorded in the ICT third-party register.","why":"Our financial customers must be able to report their full ICT supply chain to the regulator, including our sub-processors.","when":null,"coveredBy":null,"intake":{"key":"thirdPartyRegisterAck","label":"I understand the vendor will be added to the ICT third-party register before use.","type":"checkbox","required":true}},{"id":"DORA-02","text":"It is assessed whether the use case supports a critical or important function.","why":"Critical functions trigger stricter contractual and exit requirements under DORA Art. 28-30.","when":null,"coveredBy":null,"intake":{"key":"criticalFunction","label":"Does the use case support a critical or important function for a financial customer?","type":"select","required":true,"options":["Yes","No","Unsure"]}},{"id":"DORA-03","text":"An exit strategy exists in case the vendor becomes unavailable.","why":"Resilience means the process must continue without the vendor.","when":null,"coveredBy":null,"intake":{"key":"exitStrategy","label":"How would the process continue if the vendor became unavailable?","type":"textarea","required":true,"placeholder":"e.g. manual fallback, switch to Azure OpenAI within two weeks"}}],"version":1,"history":[{"version":1,"at":"2025-01-17T09:00:00Z","by":"Tom Visser","rationale":"DORA applies from 17 January 2025.","changes":["Created with DORA-01 to DORA-03"],"snapshot":null}]},{"id":"GL-SUPPLIER","type":"guideline","title":"AI Tool and Supplier Assessment Guideline","shortTitle":"Supplier Assessment","source":"Internal","issuer":"CISO Office","reference":"intranet://security/supplier-assessment","status":"active","owner":"Tom Visser","summary":"What we need to know about a tool before it can be approved: who the vendor is, where data is hosted, whether it trains on our data, which certifications it holds, how it is licensed and who pays. Free and consumer plans almost never meet the bar for Confidential data.","appliesWhen":{"all":[{"field":"toolStatus","in":["new"]}]},"requirements":[{"id":"SUP-01","text":"Vendor, hosting location and training-on-data policy are known.","why":"These three facts decide most of the security and privacy assessment.","when":null,"coveredBy":"base:tool","intake":null},{"id":"SUP-02","text":"Existing approved tools for the use case have been considered and found insufficient.","why":"Every extra tool is extra attack surface and licence cost. A short justification saves everyone a review round.","when":null,"coveredBy":"base:justification","intake":null},{"id":"SUP-03","text":"The vendor's security certifications are known.","why":"Certifications let us reuse independent audit work instead of assessing the vendor from scratch.","when":null,"coveredBy":null,"intake":{"key":"certifications","label":"Which security certifications does the vendor hold?","type":"multiselect","required":true,"options":["ISO/IEC 27001","SOC 2 Type II","ISO/IEC 42001 (AI management)","NEN 7510","None known","Unknown"]}},{"id":"SUP-04","text":"The licence type is known.","why":"Consumer and free plans usually lack a DPA, admin controls and audit logs, and often train on your data.","when":null,"coveredBy":null,"intake":{"key":"licenceType","label":"How will the tool be licensed?","type":"select","required":true,"options":["Free or consumer plan","Individual paid licence","Team or Enterprise contract","Self-hosted / open source","Unknown"]}},{"id":"SUP-05","text":"A budget holder for the licence is identified.","why":"Tools without an owner for the cost tend to be abandoned without being decommissioned.","when":null,"coveredBy":null,"intake":{"key":"budgetHolder","label":"Who is the budget holder for the licences?","type":"text","required":false,"placeholder":"Name or team"}}],"version":3,"history":[{"version":1,"at":"2024-09-05T10:00:00Z","by":"Tom Visser","rationale":"Generic supplier assessment adapted for AI tooling.","changes":["Created"],"snapshot":null},{"version":3,"at":"2026-05-06T11:30:00Z","by":"Tom Visser","rationale":"Requests for new tools rarely explained why Copilot or Azure OpenAI did not suffice; made the justification an explicit requirement.","changes":["Added SUP-02 (existing tools considered)","Added ISO/IEC 42001 to certification options"],"snapshot":null}]},{"id":"GL-MINORS","type":"guideline","title":"Working with data about children and students","shortTitle":"Minors Guideline","source":"Internal","issuer":"Privacy Office","reference":"intranet://privacy/minors","status":"active","owner":"Privacy Office","summary":"Extra care for Topicus Education products and any use case involving data about people under 16: parents and schools are informed, and AI is never used to profile or score individual pupils for automated decisions.","appliesWhen":{"all":[{"field":"dataTypes","includesAny":["minors"]}]},"requirements":[{"id":"MIN-01","text":"Schools and parents are informed about AI processing of pupil data.","why":"Schools are the data controller and must be able to inform parents; they need to know before we switch anything on.","when":null,"coveredBy":null,"intake":{"key":"schoolParentInfo","label":"How will schools and parents be informed?","type":"textarea","required":true,"placeholder":"e.g. release notes to school administrators, updated processing register for schools"}},{"id":"MIN-02","text":"AI is not used to profile or score individual pupils for automated decisions.","why":"Profiling of children is on the mandatory DPIA list and is very hard to justify under GDPR.","when":null,"coveredBy":null,"intake":{"key":"noMinorProfilingAck","label":"The use case does not profile or score individual pupils or students for automated decisions.","type":"checkbox","required":true}}],"version":1,"history":[{"version":1,"at":"2026-03-03T09:00:00Z","by":"Privacy Office","rationale":"Education division requested guidance for learning analytics pilots.","changes":["Created with MIN-01 and MIN-02"],"snapshot":null}]}],"riskRules":{"version":2,"history":[{"version":1,"at":"2025-08-01T08:10:00Z","by":"Marieke Jansen","rationale":"Initial high-risk screening rules based on EU AI Act Annex III and the Dutch DPIA list.","changes":["Created HR-01 to HR-05"],"snapshot":null},{"version":2,"at":"2026-05-06T11:45:00Z","by":"Tom Visser","rationale":"Added elevated-attention rules for new tools hosted outside the EU and vendors that train on customer data.","changes":["Added HR-06, HR-07, HR-08"],"snapshot":null}],"rules":[{"id":"HR-01","label":"AI informs or makes decisions about people","severity":"high","reference":"EU AI Act Annex III","when":{"all":[{"field":"decisionImpact","in":["informs","automated"]},{"field":"affected","includesAny":["employees","customers","patients","citizens","students"]}]},"guidance":"Decisions about employment, access to services, education or public benefits are high-risk under the AI Act. Full assessment by AI Governance is required before approval."},{"id":"HR-02","label":"Special-category personal data (health, biometrics, etc.)","severity":"high","reference":"GDPR Art. 9; Dutch DPA DPIA list","when":{"all":[{"field":"dataTypes","includesAny":["special"]}]},"guidance":"Processing special-category data with AI is on the mandatory DPIA list. Privacy Office involvement is required."},{"id":"HR-03","label":"Data about children or students","severity":"high","reference":"GDPR Recital 38; Dutch DPA DPIA list","when":{"all":[{"field":"dataTypes","includesAny":["minors"]}]},"guidance":"Children merit specific protection. Any AI processing of pupil data needs a DPIA and school-level transparency."},{"id":"HR-04","label":"Fully automated decision without human review","severity":"high","reference":"GDPR Art. 22; EU AI Act Art. 14","when":{"all":[{"field":"decisionImpact","in":["automated"]}]},"guidance":"Solely automated decisions with legal or similarly significant effects are restricted under GDPR and require human oversight measures under the AI Act."},{"id":"HR-05","label":"Secret information involved","severity":"high","reference":"Topicus Information Security Policy","when":{"all":[{"field":"classification","in":["Secret"]}]},"guidance":"Secret information is never processed by external AI vendors. CISO approval required."},{"id":"HR-06","label":"New tool hosted outside the EU with personal data","severity":"elevated","reference":"GDPR Chapter V (international transfers)","when":{"all":[{"field":"toolStatus","in":["new"]},{"field":"hosting","in":["non-eu","unknown"]},{"field":"dataTypes","includesAny":["personal","special","minors"]}]},"guidance":"International transfers need a transfer mechanism (e.g. EU-US Data Privacy Framework or SCCs) and a transfer impact assessment."},{"id":"HR-07","label":"Vendor trains models on customer data","severity":"elevated","reference":"Topicus Supplier Assessment Guideline","when":{"all":[{"field":"trainsOnData","in":["yes","unknown"]},{"field":"classification","in":["Confidential","Secret"]}]},"guidance":"Confidential information must not become part of a vendor's training data. An enterprise contract with a training opt-out is usually required."},{"id":"HR-08","label":"AI output goes directly to people outside Topicus","severity":"elevated","reference":"EU AI Act Art. 50; Topicus AI Policy AI-06","when":{"all":[{"field":"externalOutput","in":["yes"]}]},"guidance":"Customer-facing output needs transparency notices and a stronger output review process."}]}},"catalog":{"meta":{"source":"Microsoft Lists: 'AI Tools Register' (synced copy)","lastSync":"2026-09-02T22:00:00Z","note":"Reviewed tools remain stored in Microsoft Lists as the internal data store. This registry is a read model over that list, extended with model and use-case levels."},"models":[{"id":"MDL-GPT4O","name":"GPT-4o","provider":"OpenAI (via Microsoft Azure)","modality":"Text, vision","hostedIn":"EU (Azure West Europe / Sweden Central)","trainingOnCustomerData":"No (contractual)","notes":"Used by Microsoft 365 Copilot and the Topicus Azure OpenAI tenant."},{"id":"MDL-GPT4OMINI","name":"GPT-4o mini","provider":"OpenAI (via Microsoft Azure)","modality":"Text","hostedIn":"EU (Azure West Europe)","trainingOnCustomerData":"No (contractual)","notes":"Cost-efficient model for classification and extraction tasks."},{"id":"MDL-EMB3","name":"text-embedding-3-large","provider":"OpenAI (via Microsoft Azure)","modality":"Embeddings","hostedIn":"EU (Azure West Europe)","trainingOnCustomerData":"No (contractual)","notes":"Retrieval for internal knowledge bases."},{"id":"MDL-CLAUDE","name":"Claude Sonnet 4","provider":"Anthropic","modality":"Text, vision","hostedIn":"EU (via Amazon Bedrock Frankfurt) / US","trainingOnCustomerData":"No (enterprise terms)","notes":"Available inside GitHub Copilot for code tasks."},{"id":"MDL-WHISPER","name":"Whisper large-v3","provider":"OpenAI (self-hosted by Techniek Beh ose":"Code completion, code generation, test generation and code explanation inside the IDE for Topicus repositories.","conditions":["Public code filter must remain enabled.","Never paste credentials, keys or customer data into Copilot Chat.","Generated code follows the normal review pipeline."],"reviewedOn":"2025-09-14","reviewedBy":"CTO Office / CISO Office","listsItemId":18},{"id":"SYS-AOAI","name":"Azure OpenAI Service (Topicus tenant)","vendor":"Microsoft","kind":"AI platform / API","status":"approved","maxClassification":"Confidential","hostedIn":"EU (Azure West Europe, Sweden Central)","trainingOnCustomerData":"No (contractual)","models":["MDL-GPT4O","MDL-GPT4OMINI","MDL-EMB3"],"approvedPurpose":"Building AI features into Topicus products and internal tools, with content filtering and Topicus-controlled logging.","conditions":["Each product feature is registered as its own use case.","Personal data requires a per-use-case privacy assessment.","Use the shared landing zone; no personal subscriptions."],"reviewedOn":"2025-06-30","reviewedBy":"CISO Office / Privacy Office","listsItemId":15},{"id":"SYS-TEAMSRECAP","name":"Microsoft Teams Intelligent Recap","vendor":"Microsoft","kind":"Meeting transcription and summary","status":"approved","maxClassification":"Confidential","hostedIn":"EU Data Boundary","trainingOnCustomerData":"No","models":["MDL-GPT4O"],"approvedPurpose":"Transcribing and summarising internal Topicus meetings.","conditions":["Announce recording and transcription at the start of the meeting.","Not for meetings with patients, pupils or customers' end users."],"reviewedOn":"2025-08-20","reviewedBy":"Privacy Office","listsItemId":21},{"id":"SYS-WHISPER","name":"Topicus Transcribe (self-hosted Whisper)","vendor":"Topicus / Techniek Beheerd","kind":"Speech-to-text service","status":"approved","maxClassification":"Secret","hostedIn":"Topicus datacenter, Netherlands","trainingOnCustomerData":"No (self-hosted)","models":["MDL-WHISPER"],"approvedPurpose":"
