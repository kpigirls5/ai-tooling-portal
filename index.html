/*
 * Browser-only API shim for the hosted (single-file) build.
 *
 * Replaces the Node server: the same FirmService runs in the page over a
 * localStorage adapter seeded from window.FIRM_SEED. Every visitor therefore
 * gets a private sandbox copy of the data in their own browser; tabs of the
 * same browser share it (so a policy change in the registry tab shows up in
 * the portal tab), and "Reset demo data" restores the seed.
 */
(function () {
  'use strict';
  const PREFIX = 'firm.data.';
  const SEED = window.FIRM_SEED || {};

  function readLS(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function writeLS(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* private mode: keep in memory */ } }
  const mem = {};

  const store = {
    read(name) {
      if (mem[name]) return JSON.parse(JSON.stringify(mem[name]));
      const raw = readLS(PREFIX + name);
      if (raw) { try { return JSON.parse(raw); } catch (e) { /* fall through to seed */ } }
      const seed = JSON.parse(JSON.stringify(SEED[name] || {}));
      return seed;
    },
    write(name, obj) {
      const s = JSON.stringify(obj);
      mem[name] = JSON.parse(s);
      writeLS(PREFIX + name, s);
      notify(name);
    },
    reset() {
      Object.keys(SEED).forEach((name) => { delete mem[name]; try { localStorage.removeItem(PREFIX + name); } catch (e) { /* ignore */ } });
      notify('*');
    }
  };
  const service = window.FirmService.create(store);

  // Change notifications: same tab (listeners) and other tabs (storage event).
  const listeners = [];
  function notify(name) { listeners.forEach((fn) => { try { fn(name); } catch (e) { /* ignore */ } }); }
  window.addEventListener('storage', (e) => { if (e.key && e.key.indexOf(PREFIX) === 0) { const name = e.key.slice(PREFIX.length); delete mem[name]; notify(name); } });

  window.FirmLocalApi = {
    call(method, path, body, oid) {
      const user = oid ? service.userByOid(oid) : null;
      return new Promise((resolve, reject) => {
        try { resolve(service.dispatch(method, path, body, user)); }
        catch (e) { reject(new Error(e.message || 'Request failed')); }
      });
    },
    exportMeta(kind) { return service.EXPORTS[kind]; },
    onChange(fn) { listeners.push(fn); return () => { const i = listeners.indexOf(fn); if (i !== -1) listeners.splice(i, 1); }; }
  };
})();


/*
 * Mock Microsoft Entra ID sign-in + API helper + small UI utilities (shared by both apps).
 *
 * In production the apps would use MSAL and the server would validate the Entra ID
 * token. Here the "account picker" yields a mock token ("mock.<oid>") whose role
 * claims are checked on every write (by the Node server, or by the in-page service
 * in the hosted build).
 */
(function () {
  'use strict';

  let KEY = 'firm.session';

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join(''); }
  function relTime(iso) {
    if (!iso) return '';
    const d = (Date.now() - new Date(iso).getTime()) / 36e5;
    if (d < 1) return 'Signed in recently';
    if (d < 24) return 'Signed in ' + Math.round(d) + ' h ago';
    return 'Signed in ' + Math.round(d / 24) + ' d ago';
  }
  function ss(get, key, val) { try { return get ? sessionStorage.getItem(key) : (val === null ? sessionStorage.removeItem(key) : sessionStorage.setItem(key, val)); } catch (e) { return null; } }

    return '<div class="page-header"><div><h1>Use cases</h1><p>What you may do with AI, by use case rather than by tool.</p></div></div>' +
      '<div class="card" style="margin-bottom:16px"><div class="card-body row wrap"><label class="row"><span class="muted">Status</span><select id="f-status" style="width:auto">' + ['all'].concat(Object.keys(UC_STATUS)).map((k) => '<option value="' + k + '"' + (libFilter.status === k ? ' selected' : '') + '>' + (k === 'all' ? 'All' : UC_STATUS[k].label) + '</option>').join('') + '</select></label>' +
      '<label class="row"><span class="muted">Type of use</span><select id="f-cat" style="width:auto"><option value="all">All</option>' + cats.map((c) => '<option value="' + c.value + '"' + (libFilter.category === c.value ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('') + '</select></label>' +
      '<label class="row"><span class="muted">Division</span><select id="f-div" style="width:auto"><option value="all">All</option>' + E.FIELDS.division.options.map((d) => '<option value="' + d.value + '"' + (libFilter.division === d.value ? ' selected' : '') + '>' + esc(d.short) + '</option>').join('') + '</select></label>' +
      '<span class="muted right">' + list.length + ' of ' + state.catalog.useCases.length + '</span></div></div>' +
      (Object.keys(groups).length ? cats.filter((c) => groups[c.value]).map((c) => '<h2 style="margin-top:18px">' + esc(c.label) + '</h2><div class="uc-grid">' + groups[c.value].map((u) => ucCard(u)).join('') + '</div>').join('') : '<div class="empty"><h3>No use cases match these filters</h3></div>');
  }

  // ---------------------------------------------------------------------------
  // Tools and models
  // ---------------------------------------------------------------------------
  function viewRegistry(tab) {
    tab = tab || 'systems';
    const c = state.catalog;
    let body;
    if (tab === 'models') {
      body = '<div class="card"><div class="table-wrap"><table><thead><tr><th>Model</th><th>Provider</th><th>Hosted in</th><th>Trains on our data</th><th>Used by</th></tr></thead><tbody>' + c.models.map((m) => '<tr><td><b>' + esc(m.name) + '</b><div class="muted">' + esc(m.modality) + '</div></td><td>' + esc(m.provider) + '</td><td>' + esc(m.hostedIn) + '</td><td>' + esc(m.trainingOnCustomerData) + '</td><td>' + c.systems.filter((s) => s.models.indexOf(m.id) !== -1).map((s) => '<span class="tag">' + esc(s.name) + '</span> ').join('') + '</td></tr>').join('') + '</tbody></table></div></div>';
    } else {
      body = '<div class="card"><div class="table-wrap"><table><thead><tr><th>Tool</th><th>Status</th><th>Up to</th><th>Hosting &middot; training</th><th>Use cases</th></tr></thead><tbody>' + c.systems.map((s) => { const ss = SYS_STATUS[s.status]; const linked = c.useCases.filter((u) => u.systems.indexOf(s.id) !== -1); return '<tr><td><b>' + esc(s.name) + '</b><div class="muted">' + esc(s.vendor) + ' &middot; ' + esc(s.kind) + '</div><div>' + s.models.map((id) => { const m = c.models.find((x) => x.id === id); return m ? '<span class="tag">' + esc(m.name) + '</span> ' : ''; }).join('') + '</div></td><td><span class="badge ' + ss.badge + '">' + ss.label + '</span></td><td>' + esc(s.maxClassification) + '</td><td>' + esc(s.hostedIn) + '<div class="muted">Trains on our data: ' + esc(s.trainingOnCustomerData) + '</div></td><td>' + linked.map((u) => '<button class="link-btn" data-uc="' + u.id + '" style="display:block;text-align:left;font-weight:500;font-size:12.5px">' + esc(u.title) + '</button>').join('') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
    }
    return '<div class="page-header"><div><h1>Tools and models</h1><p>Reviewed tools, the models behind them and the use cases they are approved for.</p></div></div>' +
      '<div class="row" style="margin-bottom:14px"><button class="btn ' + (tab === 'systems' ? 'primary' : '') + '" data-nav="registry/systems">Tools (' + c.systems.length + ')</button><button class="btn ' + (tab === 'models' ? 'primary' : '') + '" data-nav="registry/models">Models (' + c.models.length + ')</button><button class="btn" data-nav="library">Use cases (' + c.useCases.length + ')</button></div>' + body;
  }

  // ---------------------------------------------------------------------------
  // Request wizard
  // ---------------------------------------------------------------------------
  const STEPS = ['Use case & tool', 'Details', 'Data', 'Requirements', 'Submit'];
  const STEP_VIEWS = {};

  function newIntake(seed) {
    const u = seed && seed.useCaseId ? uc(seed.useCaseId) : null;
    return Object.assign({
      step: 0,
      useCaseMode: u ? 'existing' : 'new',
      useCaseId: u ? u.id : null,
      newTitle: '',
      toolMode: seed && seed.toolMode ? seed.toolMode : (u && u.systems.length ? 'approved' : 'new'),
      systemId: null,
      newTool: { name: '', vendor: '', website: '', hosting: 'unknown', trainsOnData: 'unknown' },
      justification: '',
      base: { owner: state.user.name, purpose: u ? u.purpose : '', scope: u ? u.scope : '' },
      profile: {
        division: state.user.division || 'Corporate',
        category: u ? u.category : (seed && seed.category) || 'content',
        affected: u ? u.affected.slice() : [],
        decisionImpact: u ? u.decisionImpact : 'none',
        externalOutput: 'no',
        dataTypes: u ? u.dataTypes.slice() : [],
        classification: u ? u.classification.level : null
      },
      answers: {},
      errors: {}
    }, seed || {});
  }
  function startIntake(seed) { state.intake = newIntake(seed); saveIntake(); go('#/request'); if (route().name === 'request') render(); }
  function saveIntake() { try { sessionStorage.setItem('firm.intake', JSON.stringify(state.intake)); } catch (e) { /* ignore */ } }

  function approvedToolsFor(it) {
    if (it.useCaseMode === 'existing' && it.useCaseId) return (uc(it.useCaseId) || { systems: [] }).systems.map(sys).filter((s) => s && (s.status === 'approved' || s.status === 'restricted'));
    const ids = new Set();
    state.catalog.useCases.filter((u) => u.category === it.profile.category && (u.status === 'permitted' || u.status === 'conditional')).forEach((u) => u.systems.forEach((id) => ids.add(id)));
    return Array.from(ids).map(sys).filter((s) => s && s.status === 'approved');
  }
  function fullProfile(it) {
    const p = Object.assign({}, it.profile);
    p.toolStatus = it.toolMode === 'new' ? 'new' : 'approved';
    if (it.toolMode === 'new') { p.hosting = it.newTool.hosting; p.trainsOnData = it.newTool.trainsOnData; }
    else {
      const s = it.systemId ? sys(it.systemId) : null;
      p.hosting = s ? (/EU|Netherlands|Europe/i.test(s.hostedIn) ? 'eu' : 'non-eu') : 'eu';
      p.trainsOnData = s ? (/^No/i.test(s.trainingOnCustomerData) ? 'no' : /^Yes/i.test(s.trainingOnCustomerData) ? 'yes' : 'unknown') : 'unknown';
    }
    if (!p.classification) p.classification = E.suggestClassification(p.dataTypes);
    return p;
  }
  function evaluateIntake(it) { return E.evaluate(fullProfile(it), state.doc); }

  function viewIntake() {
    if (state.submitted) return viewSubmitted();
    if (!state.intake) state.intake = newIntake(null);
    const it = state.intake;
    const view = ['stepUseCase', 'stepDetails', 'stepData', 'stepRequirements', 'stepReview'][it.step];
    return '<div class="page-header"><div><h1>Request a tool or use case</h1><p>The form adapts to your use case and only asks what applies.</p></div><button class="btn ghost" id="intake-restart">Start over</button></div>' +
      '<div class="steps">' + STEPS.map((s, i) => '<div class="step ' + (i === it.step ? 'active' : i < it.step ? 'done' : '') + '"><span class="n">' + (i < it.step ? '&#10003;' : i + 1) + '</span>' + s + '</div>').join('') + '</div>' +
      '<div class="intake"><div class="card"><div class="card-body" id="step-body">' + STEP_VIEWS[view](it) + '</div></div><aside class="rail" id="rail">' + railHtml(it) + '</aside></div>';
  }

  function whyHtml(ref, text) { return '<details class="why"><summary>Why we ask</summary><div class="why-body"><b>' + esc(ref) + '.</b> ' + esc(text) + '</div></details>'; }
  function err(it, k) { return it.errors[k] ? '<div class="err">' + esc(it.errors[k]) + '</div>' : ''; }
  function fieldCls(it, k) { return 'field' + (it.errors[k] ? ' invalid' : ''); }

  // Step 1: use case and tool ---------------------------------------------------
  STEP_VIEWS.stepUseCase = function (it) {
    const existing = it.useCaseMode === 'existing' ? uc(it.useCaseId) : null;
    const approved = approvedToolsFor(it);
    const candidates = it.useCaseMode === 'existing' && existing ? existing.systems.map(sys).filter(Boolean) : approved;
    let html = '<h2>What do you want to do?</h2>' +
      '<div class="choice-list" style="margin-bottom:14px">' +
      '<label class="choice ' + (it.useCaseMode === 'existing' ? 'on' : '') + '"><input type="radio" name="ucm" value="existing" ' + (it.useCaseMode === 'existing' ? 'checked' : '') + '><span><div class="t">An existing use case</div><div class="h">You need a different tool for a use case that is already in the library.</div></span></label>' +
      '<label class="choice ' + (it.useCaseMode === 'new' ? 'on' : '') + '"><input type="radio" name="ucm" value="new" ' + (it.useCaseMode === 'new' ? 'checked' : '') + '><span><div class="t">A new use case</div><div class="h">Nothing in the library covers your need.</div></span></label></div>';
    if (it.useCaseMode === 'existing') {
      html += '<label class="' + fieldCls(it, 'useCaseId') + '"><span class="lbl">Use case <span class="req">*</span></span><select data-k="useCaseId"><option value="">Select a use case</option>' + state.catalog.useCases.filter((u) => u.status !== 'not-permitted').map((u) => '<option value="' + u.id + '"' + (it.useCaseId === u.id ? ' selected' : '') + '>' + esc(u.title) + '</option>').join('') + '</select>' + err(it, 'useCaseId') + '</label>';
      if (existing) html += '<div class="panel" style="margin-bottom:14px"><div class="row wrap"><span class="badge ' + UC_STATUS[existing.status].badge + '">' + UC_STATUS[existing.status].label + '</span><span class="badge outline">' + esc(existing.classification.level) + '</span><span class="muted">' + esc(existing.scope) + '</span></div></div>';
    } else {
      html += '<label class="' + fieldCls(it, 'newTitle') + '"><span class="lbl">Name the use case <span class="req">*</span></span><input type="text" data-k="newTitle" value="' + esc(it.newTitle) + '" placeholder="e.g. Drafting tender answers from past bids">' + err(it, 'newTitle') + '</label>' +
        '<label class="field"><span class="lbl">Type of use</span><select data-p="category">' + E.FIELDS.category.options.map((o) => '<option value="' + o.value + '"' + (it.profile.category === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select>' + whyHtml(BASE_WHY.category[0], BASE_WHY.category[1]) + '</label>';
      const similar = search(it.newTitle || '').useCases.filter((x) => x.u.status !== 'not-permitted').slice(0, 3);
      if (similar.length) html += '<div class="callout info" style="margin-bottom:14px"><b>Similar approved use cases:</b><div style="margin-top:6px">' + similar.map((x) => '<button class="link-btn" data-uc="' + x.u.id + '" style="display:block;text-align:left">' + esc(x.u.title) + ' <span class="badge ' + UC_STATUS[x.u.status].badge + '" style="font-weight:500">' + UC_STATUS[x.u.status].label + '</span></button>').join('') + '</div></div>';
    }
    html += '<hr><h2>Which tool?</h2>';
    if (candidates.length) html += '<p class="muted">Already approved for this kind of use. Pick one, or request a tool that is not in the register.</p>';
    html += '<div class="tool-pick">' + candidates.map((s) => '<label class="tool-card ' + (it.toolMode === 'approved' && it.systemId === s.id ? 'on' : '') + '"><input type="radio" name="tool" value="' + s.id + '" ' + (it.toolMode === 'approved' && it.systemId === s.id ? 'checked' : '') + '><span><div class="t">' + esc(s.name) + '</div><div class="m">' + SYS_STATUS[s.status].label + ' &middot; up to ' + esc(s.maxClassification) + ' &middot; ' + esc(s.hostedIn) + '</div></span></label>').join('') +
      '<label class="tool-card new ' + (it.toolMode === 'new' ? 'on' : '') + '"><input type="radio" name="tool" value="__new" ' + (it.toolMode === 'new' ? 'checked' : '') + '><span><div class="t">A tool that is not in the register</div><div class="m">A few questions about the vendor follow.</div></span></label></div>' + err(it, 'tool');
    if (it.toolMode === 'new') {
      const nt = it.newTool;
      html += '<div class="panel" style="margin-top:14px"><div class="row spread wrap"><h3 style="margin:0">About the tool</h3><button class="btn sm" id="lookup-tool" ' + (nt.name.trim() ? '' : 'disabled') + '>Look up tool details</button></div>' +
        '<div class="grid grid-2" style="margin-top:10px"><label class="' + fieldCls(it, 'toolName') + '"><span class="lbl">Tool name <span class="req">*</span></span><input type="text" data-nt="name" value="' + esc(nt.name) + '" placeholder="e.g. Fireflies.ai">' + err(it, 'toolName') + '</label><label class="field"><span class="lbl">Vendor</span><input type="text" data-nt="vendor" value="' + esc(nt.vendor) + '"></label>' +
        '<label class="field"><span class="lbl">Website</span><input type="url" data-nt="website" value="' + esc(nt.website) + '" placeholder="https://"></label>' +
        '<label class="field"><span class="lbl">Where is data hosted?</span><select data-nt="hosting">' + E.FIELDS.hosting.options.map((o) => '<option value="' + o.value + '"' + (nt.hosting === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select></label>' +
        '<label class="field"><span class="lbl">Does the vendor train on customer data?</span><select data-nt="trainsOnData">' + E.FIELDS.trainsOnData.options.map((o) => '<option value="' + o.value + '"' + (nt.trainsOnData === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>').join('') + '</select></label></div>' +
        '<div id="assist"></div>' + whyHtml('Supplier Assessment Guideline SUP-01', 'Vendor, hosting and training policy decide most of the security and privacy review. Unknown is an acceptable answer.') + '</div>';
      if (approved.length) {
        html += '<label class="' + fieldCls(it, 'justification') + '" style="margin-top:14px"><span class="lbl">Why do the approved tools not meet your need? <span class="req">*</span></span><div class="muted" style="margin-bottom:6px">' + approved.map((s) => '<span class="tag">' + esc(s.name) + '</span>').join(' ') + '</div><textarea data-k="justification" placeholder="A missing feature, an unsupported platform, a customer requirement.">' + esc(it.justification) + '</textarea>' + err(it, 'justification') + whyHtml('Supplier Assessment Guideline SUP-02', 'Every extra tool adds attack surface and licence cost. A concrete reason saves a review round.') + '</label>';
      }
    }
    return html;
  };

  // Step 2: details --------------------------------------------------------------
  STEP_VIEWS.stepDetails = function (it) {
    const P = it.profile;
    const sel = (k, o) => '<select data-p="' + k + '">' + o.map((x) => '<option value="' + x.value + '"' + (P[k] === x.value ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') + '</select>';
    return '<h2>Use case details</h2>' +
      '<label class="' + fieldCls(it, 'owner') + '"><span class="lbl">Accountable owner <span class="req">*</span></span><input type="text" data-b="owner" value="' + esc(it.base.owner) + '">' + err(it, 'owner') + whyHtml(BASE_WHY.owner[0], BASE_WHY.owner[1]) + '</label>' +
      '<label class="' + fieldCls(it, 'purpose') + '"><span class="lbl">Purpose <span class="req">*</span></span><textarea data-b="purpose" placeholder="What problem does this solve, for whom?">' + esc(it.base.purpose) + '</textarea>' + err(it, 'purpose') + whyHtml(BASE_WHY.purpose[0], BASE_WHY.purpose[1]) + '</label>' +
      '<label class="' + fieldCls(it, 'scope') + '"><span class="lbl">Scope <span class="req">*</span></span><textarea data-b="scope" placeholder="Which teams, systems and data are in scope? What is out?">' + esc(it.base.scope) + '</textarea>' + err(it, 'scope') + whyHtml(BASE_WHY.scope[0], BASE_WHY.scope[1]) + '</label>' +
      '<div class="grid grid-2"><label class="field"><span class="lbl">Division</span>' + sel('division', E.FIELDS.division.options) + whyHtml(BASE_WHY.division[0], BASE_WHY.division[1]) + '</label>' +
      (it.useCaseMode === 'existing' ? '<label class="field"><span class="lbl">Type of use</span>' + sel('category', E.FIELDS.category.options) + whyHtml(BASE_WHY.category[0], BASE_WHY.category[1]) + '</label>' : '<div></div>') + '</div>' +
      '<div class="' + fieldCls(it, 'affected') + '"><span class="lbl">Who is affected by the output? <span class="req">*</span></span><div class="chips">' + E.FIELDS.affected.options.map((o) => '<button class="chip ' + (P.affected.indexOf(o.value) !== -1 ? 'on' : '') + '" data-many="affected:' + o.value + '">' + esc(o.label) + '</button>').join('') + '</div>' + err(it, 'affected') + whyHtml(BASE_WHY.affected[0], BASE_WHY.affected[1]) + '</div>' +
      '<div class="grid grid-2" style="margin-top:14px"><label class="field"><span class="lbl">Role in decisions about people</span>' + sel('decisionImpact', E.FIELDS.decisionImpact.options) + whyHtml(BASE_WHY.decisionImpact[0], BASE_WHY.decisionImpact[1]) + '</label>' +
      '<label class="field"><span class="lbl">Is output shared outside Topicus?</span>' + sel('externalOutput', E.FIELDS.externalOutput.options) + whyHtml(BASE_WHY.externalOutput[0], BASE_WHY.externalOutput[1]) + '</label></div>';
  };

  // Step 3: data and classification --------------------------------------------------
  STEP_VIEWS.stepData = function (it) {
    const P = it.profile;
    const suggested = E.suggestClassification(P.dataTypes);
    const s = it.toolMode === 'approved' && it.systemId ? sys(it.systemId) : null;
    const warn = (s && P.classification && !E.classificationAtLeast(s.maxClassification, P.classification)) ? '<div class="callout warn" style="margin-top:12px"><b>' + esc(s.name) + ' is approved up to ' + esc(s.maxClassification) + '.</b> Your request will be flagged for security review.</div>' : '';
    return '<h2>Data and classification</h2>' +
      '<div class="' + fieldCls(it, 'dataTypes') + '"><span class="lbl">Which data is involved? <span class="req">*</span></span><div class="choice-list">' + E.FIELDS.dataTypes.options.map((o) => '<label class="choice ' + (P.dataTypes.indexOf(o.value) !== -1 ? 'on' : '') + '"><input type="checkbox" data-many="dataTypes:' + o.value + '" ' + (P.dataTypes.indexOf(o.value) !== -1 ? 'checked' : '') + '><span><div class="t">' + esc(o.label) + '</div></span></label>').join('') + '</div>' + err(it, 'dataTypes') + whyHtml(BASE_WHY.dataTypes[0], BASE_WHY.dataTypes[1]) + '</div>' +
      '<div class="' + fieldCls(it, 'classification') + '" style="margin-top:18px"><span class="lbl">Confirm the classification <span class="req">*</span></span><p class="muted">Suggested from your data: <b>' + esc(suggested) + '</b>.</p><div class="class-pick">' + E.FIELDS.classification.options.map((o) => '<label class="choice ' + (P.classification === o.value ? 'on' : '') + '"><div class="row"><input type="radio" name="cls" value="' + o.value + '" ' + (P.classification === o.value ? 'checked' : '') + '><span class="t">' + esc(o.label) + '</span>' + (o.value === suggested ? '<span class="sugg">suggested</span>' : '') + '</div><div class="h">' + esc(o.hint) + '</div></label>').join('') + '</div>' + err(it, 'classification') + whyHtml(BASE_WHY.classification[0], BASE_WHY.classification[1]) + warn + '</div>';
  };

  // Step 4: requirements (generated from the applicable policies) -------------------------
  STEP_VIEWS.stepRequirements = function (it) {
    const res = evaluateIntake(it);
    let html = '<h2>Requirements</h2><p class="muted">' + res.applicable.length + ' policies and guidelines apply to your use case. Only their questions are asked.</p>';
    res.applicable.forEach((a) => {
      const fields = res.intakeFields.filter((f) => f.policyId === a.id);
      const covered = a.requirements.filter((r) => r.coveredBy);
      html += '<div class="policy-group"><div class="pg-head"><b>' + esc(a.title) + '</b><span class="badge outline">' + esc(a.type) + '</span><details class="why right"><summary>Why this applies</summary><div class="why-body">' + esc(a.reason) + '</div></details></div><div class="pg-body">' +
        covered.map((r) => '<div class="covered"><span class="ok">&#10003;</span><span>' + esc(r.text) + ' <span class="muted">(covered by ' + esc(r.coveredLabel).toLowerCase() + ')</span></span></div>').join('') +
        fields.map((f) => fieldHtml(it, f)).join('') +
        (!fields.length && !covered.length ? '<p class="muted">For your information; nothing to fill in.</p>' : '') +
        '</div></div>';
    });
    return html;
  };
  function fieldHtml(it, f) {
    const v = it.answers[f.key];
    const req = f.required ? ' <span class="req">*</span>' : ' <span class="opt">optional</span>';
    const why = '<details class="why"><summary>Why we ask</summary><div class="why-body"><b>' + esc(f.policyTitle) + ' ' + esc(f.requirementId) + ': ' + esc(f.requirementText) + '</b><br>' + esc(f.why) + '</div></details>';
    const e = it.errors[f.key] ? '<div class="err">' + esc(it.errors[f.key]) + '</div>' : '';
    const cls = 'field' + (it.errors[f.key] ? ' invalid' : '');
    if (f.type === 'checkbox') return '<div class="' + cls + '"><label class="choice ' + (v ? 'on' : '') + '"><input type="checkbox" data-a="' + f.key + '" data-bool="1" ' + (v ? 'checked' : '') + '><span class="t">' + esc(f.label) + req + '</span></label>' + e + why + '</div>';
    if (f.type === 'select') return '<label class="' + cls + '"><span class="lbl">' + esc(f.label) + req + '</span><select data-a="' + f.key + '"><option value="">Select&hellip;</option>' + f.options.map((o) => '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' + e + why + '</label>';
    if (f.type === 'multiselect') return '<div class="' + cls + '"><span class="lbl">' + esc(f.label) + req + '</span><div class="chips">' + f.options.map((o) => '<button class="chip ' + ((v || []).indexOf(o) !== -1 ? 'on' : '') + '" data-amany="' + f.key + ':' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' + e + why + '</div>';
    if (f.type === 'textarea') return '<label class="' + cls + '"><span class="lbl">' + esc(f.label) + req + '</span><textarea data-a="' + f.key + '" placeholder="' + esc(f.placeholder) + '">' + esc(v || '') + '</textarea>' + e + why + '</label>';
    return '<label class="' + cls + '"><span class="lbl">' + esc(f.label) + req + '</span><input type="text" data-a="' + f.key + '" value="' + esc(v || '') + '" placeholder="' + esc(f.placeholder) + '">' + e + why + '</label>';
  }

  // Step 5: review and submit -------------------------------------------------------
  STEP_VIEWS.stepReview = function (it) {
    const res = evaluateIntake(it);
    const P = fullProfile(it);
    const routing = E.route(P, res.risk.level, state.routing);
    const u = it.useCaseMode === 'existing' ? uc(it.useCaseId) : null;
    const toolName = it.toolMode === 'new' ? it.newTool.name : (sys(it.systemId) || {}).name;
    return '<h2>Review and submit</h2>' +
      '<dl class="kv"><dt>Use case</dt><dd>' + esc(u ? u.title : it.newTitle) + (u ? '' : ' <span class="badge blue">new</span>') + '</dd><dt>Tool</dt><dd>' + esc(toolName) + (it.toolMode === 'new' ? ' <span class="badge amber">new tool</span>' : ' <span class="badge green">approved</span>') + '</dd>' + (it.justification ? '<dt>Why approved tools do not fit</dt><dd>' + esc(it.justification) + '</dd>' : '') +
      '<dt>Owner</dt><dd>' + esc(it.base.owner) + '</dd><dt>Purpose</dt><dd>' + esc(it.base.purpose) + '</dd><dt>Scope</dt><dd>' + esc(it.base.scope) + '</dd>' +
      '<dt>Profile</dt><dd>' + ['division', 'category', 'classification', 'dataTypes', 'affected', 'decisionImpact', 'externalOutput'].map((k) => '<span class="tag">' + esc(E.FIELDS[k].label) + ': ' + esc(Array.isArray(P[k]) ? P[k].map((v) => E.optionLabel(k, v, true)).join(', ') : E.optionLabel(k, P[k], true)) + '</span> ').join('') + '</dd></dl>' +
      '<h3 style="margin-top:16px">Answers</h3><table><tbody>' + res.intakeFields.filter((f) => it.answers[f.key] !== undefined && it.answers[f.key] !== '').map((f) => '<tr><td style="width:55%">' + esc(f.label) + '<div class="muted">' + esc(f.policyTitle) + ' &middot; ' + esc(f.requirementId) + '</div></td><td>' + esc(it.answers[f.key] === true ? 'Confirmed' : Array.isArray(it.answers[f.key]) ? it.answers[f.key].join(', ') : it.answers[f.key]) + '</td></tr>').join('') + '</tbody></table>' +
      '<h3 style="margin-top:16px">What happens next</h3><div class="flow">' +
      '<div class="flow-step"><span class="ic">1</span><div><b>Checked against ' + res.applicable.length + ' policies and guidelines</b><div class="muted">' + res.applicable.map((a) => esc(a.shortTitle)).join(', ') + '.</div></div></div>' +
      '<div class="flow-step"><span class="ic">2</span><div><b>Handed to the approval flow</b><div class="muted">The existing Power Automate flow creates the request record and notifies the reviewer.</div></div></div>' +
      '<div class="flow-step"><span class="ic">3</span><div><b>Reviewed by ' + esc(routing.primary.name) + '</b><div class="muted">' + esc(routing.primary.role) + (routing.escalations.length ? ', together with ' + routing.escalations.map((e) => esc(e.to.name)).join(' and ') : '') + '. The decision is always made by a person.</div></div></div></div>' +
      '<div id="submit-err" class="callout danger" style="margin-top:12px" hidden></div>';
  };

  function railHtml(it) {
    const res = evaluateIntake(it);
    const P = fullProfile(it);
    const rl = E.RISK_LABELS[res.risk.level];
    const routing = E.route(P, res.risk.level, state.routing);
    return '<div class="card"><div class="card-head"><h3>What applies</h3><span class="muted right">' + res.intakeFields.length + ' questions</span></div><div class="card-body">' +
      '<div class="risk-meter ' + res.risk.level + '"><div><b>' + esc(rl.title) + '</b><div style="font-size:12.5px">' + (res.risk.flags.length ? res.risk.flags.map((f) => esc(f.label)).join(' &middot; ') : 'No high-risk rules triggered') + '</div></div></div>' +
      '<div style="margin-top:12px">' + res.applicable.map((a) => '<div class="rail-pol"><span>' + esc(a.shortTitle) + '</span><span class="v right">v' + a.version + '</span></div>').join('') + '</div></div></div>' +
      '<div class="card"><div class="card-head"><h3>Who reviews</h3></div><div class="card-body"><div><b>' + esc(routing.primary.name) + '</b><div class="muted">' + esc(routing.primary.role) + '</div></div>' + routing.escalations.map((e) => '<div style="margin-top:8px"><b>' + esc(e.to.name) + '</b><div class="muted">' + esc(e.label) + '</div></div>').join('') + '</div></div>';
  }

  function validateStep(it) {
    const e = {};
    if (it.step === 0) {
      if (it.useCaseMode === 'existing' && !it.useCaseId) e.useCaseId = 'Select a use case';
      if (it.useCaseMode === 'new' && !it.newTitle.trim()) e.newTitle = 'Name the use case';
      if (it.toolMode === 'approved' && !it.systemId) e.tool = 'Select a tool';
      if (it.toolMode === 'new' && !it.newTool.name.trim()) e.toolName = 'Enter the tool name';
      if (it.toolMode === 'new' && approvedToolsFor(it).length && !it.justification.trim()) e.justification = 'Explain why the approved tools do not meet your need';
    }
    if (it.step === 1) {
      if (!it.base.owner.trim()) e.owner = 'Required';
      if (!it.base.purpose.trim()) e.purpose = 'Required';
      if (!it.base.scope.trim()) e.scope = 'Required';
      if (!it.profile.affected.length) e.affected = 'Select at least one option';
    }
    if (it.step === 2) {
      if (!it.profile.dataTypes.length) e.dataTypes = 'Select at least one option';
      if (!it.profile.classification) e.classification = 'Confirm a classification';
    }
    if (it.step === 3) {
      evaluateIntake(it).intakeFields.forEach((f) => { const v = it.answers[f.key]; if (f.required && (v === undefined || v === '' || v === false || (Array.isArray(v) && !v.length))) e[f.key] = 'Required'; });
    }
    it.errors = e;
    return !Object.keys(e).length;
  }

  function bindIntake() {
    const it = state.intake; if (!it) return;
    const body = document.getElementById('step-body'); if (!body) return;
    const rerender = () => { saveIntake(); render(); };
    const rail = () => { saveIntake(); const r = document.getElementById('rail'); if (r) r.innerHTML = railHtml(it); };

    body.insertAdjacentHTML('beforeend', '<div class="nav-btns">' + (it.step > 0 ? '<button class="btn" id="prev">&larr; Back</button>' : '<span></span>') + (it.step < STEPS.length - 1 ? '<button class="btn primary" id="next">Continue &rarr;</button>' : '<button class="btn primary lg" id="submit">Submit request</button>') + '</div>');
    document.getElementById('intake-restart').addEventListener('click', async () => { if (await UI.confirm('Discard this request and start over?', 'Start over')) { state.intake = newIntake(null); saveIntake(); render(); } });
    const prev = document.getElementById('prev'); if (prev) prev.addEventListener('click', () => { it.step--; it.errors = {}; rerender(); window.scrollTo(0, 0); });
    const next = document.getElementById('next'); if (next) next.addEventListener('click', () => { if (validateStep(it)) { it.step++; rerender(); window.scrollTo(0, 0); } else { rerender(); toast('Please complete the highlighted fields', 'err'); } });
    const sub = document.getElementById('submit'); if (sub) sub.addEventListener('click', submitIntake);

    body.addEventListener('change', (e) => {
      const t = e.target;
      if (t.name === 'ucm') { it.useCaseMode = t.value; if (t.value === 'new') it.useCaseId = null; else it.toolMode = 'approved'; it.systemId = null; rerender(); return; }
      if (t.getAttribute('data-k') === 'useCaseId') {
        const u = uc(t.value); it.useCaseId = t.value || null;
        if (u) { it.base.purpose = u.purpose; it.base.scope = u.scope; it.profile.category = u.category; it.profile.affected = u.affected.slice(); it.profile.decisionImpact = u.decisionImpact; it.profile.dataTypes = u.dataTypes.slice(); it.profile.classification = u.classification.level; it.toolMode = u.systems.length ? 'approved' : 'new'; it.systemId = null; }
        rerender(); return;
      }
      if (t.name === 'tool') { if (t.value === '__new') { it.toolMode = 'new'; it.systemId = null; } else { it.toolMode = 'approved'; it.systemId = t.value; } rerender(); return; }
      if (t.name === 'cls') { it.profile.classification = t.value; rerender(); return; }
      if (t.getAttribute('data-p')) { it.profile[t.getAttribute('data-p')] = t.value; if (t.getAttribute('data-p') === 'category' && it.useCaseMode === 'new') rerender(); else rail(); return; }
      if (t.getAttribute('data-nt')) { it.newTool[t.getAttribute('data-nt')] = t.value; rail(); return; }
      if (t.getAttribute('data-b')) { it.base[t.getAttribute('data-b')] = t.value; return; }
      if (t.getAttribute('data-k')) { it[t.getAttribute('data-k')] = t.value; return; }
      if (t.getAttribute('data-many')) { const [k, v] = t.getAttribute('data-many').split(':'); toggleMany(it.profile, k, v); rerender(); return; }
      if (t.getAttribute('data-a')) { it.answers[t.getAttribute('data-a')] = t.getAttribute('data-bool') ? t.checked : t.value; if (t.closest('.choice')) t.closest('.choice').classList.toggle('on', t.checked); saveIntake(); return; }
    });
    body.addEventListener('input', (e) => {
      const t = e.target;
      if (t.getAttribute('data-b')) { it.base[t.getAttribute('data-b')] = t.value; saveIntake(); }
      if (t.getAttribute('data-k')) { it[t.getAttribute('data-k')] = t.value; saveIntake(); if (t.getAttribute('data-k') === 'newTitle') debounceSimilar(); }
      if (t.getAttribute('data-nt')) { it.newTool[t.getAttribute('data-nt')] = t.value; saveIntake(); const lb = document.getElementById('lookup-tool'); if (lb) lb.disabled = !it.newTool.name.trim(); }
      if (t.getAttribute('data-a')) { it.answers[t.getAttribute('data-a')] = t.value; saveIntake(); }
    });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.getAttribute('data-many')) { e.preventDefault(); const [k, v] = b.getAttribute('data-many').split(':'); toggleMany(it.profile, k, v); b.classList.toggle('on'); rail(); return; }
      if (b.getAttribute('data-amany')) { e.preventDefault(); const a = b.getAttribute('data-amany'); const k = a.slice(0, a.indexOf(':')), v = a.slice(a.indexOf(':') + 1); it.answers[k] = it.answers[k] || []; toggleMany(it.answers, k, v); b.classList.toggle('on'); saveIntake(); return; }
      if (b.id === 'lookup-tool') { e.preventDefault(); lookupTool(); return; }
      if (b.getAttribute('data-uc')) { e.preventDefault(); openUseCase(b.getAttribute('data-uc')); }
    });
    let simTimer = null;
    function debounceSimilar() { clearTimeout(simTimer); simTimer = setTimeout(() => { const active = document.activeElement; const pos = active && active.selectionStart; rerender(); const inp = document.querySelector('[data-k="newTitle"]'); if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (x) { /* ignore */ } } }, 700); }
  }
  function toggleMany(obj, k, v) { const arr = obj[k] || []; obj[k] = arr.indexOf(v) !== -1 ? arr.filter((x) => x !== v) : arr.concat([v]); }

  async function lookupTool() {
    const it = state.intake; const host = document.getElementById('assist'); if (!host) return;
    host.innerHTML = '<div class="assist" style="margin-top:10px"><h4>Looking up &ldquo;' + esc(it.newTool.name) + '&rdquo;&hellip;</h4></div>';
    try {
      const r = await Api.get('/api/tool-lookup?name=' + encodeURIComponent(it.newTool.name.trim()));
      if (!r.found) { host.innerHTML = '<div class="assist" style="margin-top:10px"><h4>No details found for &ldquo;' + esc(it.newTool.name) + '&rdquo;</h4><div class="muted">Fill in what you know. The reviewer completes the supplier assessment.</div></div>'; return; }
      const t = r.tool;
      const already = state.catalog.systems.find((s) => s.name.toLowerCase().indexOf(t.name.toLowerCase().split(' ')[0]) === 0);
      host.innerHTML = '<div class="assist" style="margin-top:10px"><h4>' + esc(t.name) + ' by ' + esc(t.vendor) + '</h4><dl class="kv" style="grid-template-columns:130px 1fr"><dt>Kind</dt><dd>' + esc(t.kind) + '</dd><dt>Hosting</dt><dd>' + esc(t.hostingNote) + '</dd><dt>Training on data</dt><dd>' + esc(t.trainsNote) + '</dd><dt>Certifications</dt><dd>' + t.certifications.map(esc).join(', ') + '</dd></dl>' +
        (already ? '<div class="callout ' + (already.status === 'not-permitted' ? 'danger' : 'info') + '" style="margin-top:8px;padding:8px 12px"><b>Already reviewed:</b> ' + esc(already.name) + ' is ' + SYS_STATUS[already.status].label.toLowerCase() + '.</div>' : '') +
        '<div class="row" style="margin-top:10px"><button class="btn sm primary" id="apply-lookup">Use these details</button><span class="muted">Please verify before submitting.</span></div></div>';
      host.querySelector('#apply-lookup').addEventListener('click', () => {
        it.newTool.vendor = t.vendor; it.newTool.website = t.website; it.newTool.hosting = t.hosting; it.newTool.trainsOnData = t.trainsOnData;
        if (t.certifications && t.certifications.length) it.answers.certifications = t.certifications.slice();
        saveIntake(); render(); toast('Tool details filled in', 'ok');
      });
    } catch (e) { host.innerHTML = '<div class="assist" style="margin-top:10px">' + esc(e.message) + '</div>'; }
  }

  async function submitIntake() {
    const it = state.intake;
    const btn = document.getElementById('submit'); btn.disabled = true;
    const u = it.useCaseMode === 'existing' ? uc(it.useCaseId) : null;
    const payload = {
      type: it.toolMode === 'new' ? 'new-tool' : (u ? 'existing-use-case' : 'new-use-case'),
      useCaseId: u ? u.id : null,
      useCaseTitle: u ? u.title : it.newTitle,
      useCaseHasApprovedTools: approvedToolsFor(it).length > 0,
      tool: it.toolMode === 'new' ? Object.assign({ mode: 'new' }, it.newTool) : { mode: 'approved', systemId: it.systemId, name: (sys(it.systemId) || {}).name },
      justification: it.justification,
      profile: fullProfile(it),
      base: Object.assign({ title: it.newTitle || null }, it.base),
      answers: it.answers
    };
    try {
      const r = await Api.post('/api/requests', payload);
      state.submitted = r; state.intake = null; sessionStorage.removeItem('firm.intake');
      await reload(); render(); window.scrollTo(0, 0);
    } catch (e) {
      btn.disabled = false;
      const el = document.getElementById('submit-err'); el.hidden = false; el.textContent = e.message;
    }
  }

  function viewSubmitted() {
    const r = state.submitted.request, ev = state.submitted.evaluation, rt = state.submitted.routing;
    const rl = E.RISK_LABELS[r.risk.level];
    return '<div class="card"><div class="card-body success"><div class="big">&#10003;</div><h1>Request ' + esc(r.id) + ' submitted</h1><p class="muted">' + esc(r.useCaseTitle) + (r.tool ? ' &middot; ' + esc(r.tool.name) : '') + '</p>' +
      '<div class="row" style="justify-content:center;margin:10px 0"><span class="badge ' + (r.risk.level === 'high' ? 'red' : r.risk.level === 'elevated' ? 'amber' : 'green') + '">' + esc(rl.title) + '</span></div>' +
      '<div class="flow">' +
      '<div class="flow-step"><span class="ic done">&#10003;</span><div><b>Checked against ' + ev.applicable.length + ' policies and guidelines</b><div class="muted">' + (ev.risk.flags.length ? 'Flags: ' + ev.risk.flags.map((f) => esc(f.label)).join('; ') + '.' : 'No high-risk rules triggered.') + '</div></div></div>' +
      '<div class="flow-step"><span class="ic done">&#10003;</span><div><b>Handed to the approval flow</b><div class="muted">Request record #' + esc(r.routing.listsItemId) + ' created; reviewer notified.</div></div></div>' +
      '<div class="flow-step"><span class="ic wait">&#8987;</span><div><b>Awaiting review by ' + esc(rt.primary.name) + '</b><div class="muted">' + esc(rt.primary.role) + (rt.escalations.length ? ', together with ' + rt.escalations.map((e) => esc(e.to.name)).join(' and ') : '') + '.</div></div></div></div>' +
      '<div class="row" style="justify-content:center;margin-top:22px"><button class="btn primary" id="to-home">Back to search</button></div></div></div>';
  }

  // ---------------------------------------------------------------------------
  function bindView(r) {
    app.querySelectorAll('[data-nav]').forEach((b) => b.addEventListener('click', () => go('#/' + b.getAttribute('data-nav'))));
    app.querySelectorAll('[data-uc]').forEach((el) => { if (!el.closest('#step-body')) el.addEventListener('click', (e) => { e.stopPropagation(); openUseCase(el.getAttribute('data-uc')); }); });
    app.querySelectorAll('#req-new-uc').forEach((b) => b.addEventListener('click', () => startIntake({ useCaseMode: 'new', newTitle: state.query.trim() && !search(state.query).useCases.length ? state.query.trim() : '' })));
    const form = document.getElementById('search-form');
    if (form) {
      form.addEventListener('submit', (e) => { e.preventDefault(); state.query = document.getElementById('q').value; render(); const res = document.getElementById('results'); if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
      app.querySelectorAll('[data-intent]').forEach((c) => c.addEventListener('click', () => { state.query = c.getAttribute('data-intent'); render(); }));
      if (!state.query) document.getElementById('q').focus();
    }
    ['f-status', 'f-cat', 'f-div'].forEach((id) => { const el = document.getElementById(id); if (el) el.addEventListener('change', () => { libFilter[{ 'f-status': 'status', 'f-cat': 'category', 'f-div': 'division' }[id]] = el.value; render(); }); });
    if (r.name === 'request') {
      if (state.submitted) document.getElementById('to-home').addEventListener('click', () => { state.submitted = null; state.query = ''; go('#/'); });
      else bindIntake();
    } else if (state.submitted) state.submitted = null;
  }

  boot().catch((e) => { app.innerHTML = '<div class="empty"><h3>Could not load the portal</h3><p>' + esc(e.message) + '</p></div>'; });
  return { stop: stop };
} };


window.FirmBoot = { restart: function () { window.__firmApp && window.__firmApp.stop(); window.__firmApp = window.FirmPortal.start(document.getElementById('app'), {}); } };
window.__firmApp = window.FirmPortal.start(document.getElementById('app'), {});
</script>
</body>
</html>
